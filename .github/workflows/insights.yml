name: Daily insights

on:
  schedule:
    # Two attempts so a skipped/delayed cron still runs. Re-running is harmless
    # (it just refreshes the numbers), so no guard is needed.
    - cron: "23 16 * * *"     # 10:23am Costa Rica
    - cron: "53 16 * * *"     # 10:53am Costa Rica (backup)
  workflow_dispatch:

jobs:
  insights:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
        run: python fetch_insights.py
      - run: |
          git config user.name  "auto-poster"
          git config user.email "actions@github.com"
          git add -A
          git diff --staged --quiet && { echo "nothing to commit"; exit 0; }
          git commit -m "Daily insights [skip ci]"
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "push rejected (attempt $i) — rebasing on remote and retrying"
            git pull --rebase --autostash origin "${{ github.ref_name }}" || true
            sleep $((RANDOM % 4 + 2))
          done
          echo "push still failing after retries"; exit 1
