name: Monthly review

on:
  schedule:
    # 1st of the month, off :00, with a backup attempt. A "once per month" guard in
    # review.py ensures the backup never opens a duplicate review.
    - cron: "17 15 1 * *"     # 1st, 9:17 Costa Rica
    - cron: "47 15 1 * *"     # 1st, 9:47 Costa Rica (backup)
  workflow_dispatch:

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: write          # commit REVIEW-LATEST.md + metrics/review-latest.json
      models: read             # free GitHub Models for the narrative
      issues: write            # open the review issue that notifies the owner
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python review.py
      - run: |
          git config user.name  "auto-poster"
          git config user.email "actions@github.com"
          git add -A
          git diff --staged --quiet && { echo "nothing to commit"; exit 0; }
          git commit -m "Monthly review [skip ci]"
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "push rejected (attempt $i) — rebasing on remote and retrying"
            git pull --rebase --autostash origin "${{ github.ref_name }}" || true
            sleep $((RANDOM % 4 + 2))
          done
          echo "push still failing after retries"; exit 1
