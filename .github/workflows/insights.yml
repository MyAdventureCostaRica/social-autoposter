name: Daily insights

on:
  schedule:
    # Two attempts so a skipped/delayed cron still runs. Re-running is harmless
    # (it just refreshes the numbers), so no guard is needed.
    - cron: "23 16 * * *"     # 10:23am Costa Rica
    - cron: "53 16 * * *"     # 10:53am Costa Rica (backup)
  workflow_dispatch:

jobs:
  insights:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
        run: python fetch_insights.py
      - run: |
          git config user.name  "auto-poster"
          git config user.email "actions@github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Daily insights [skip ci]"
          git push
