name: Caption preview (voice check)

# Voice calibration tool (Sep 29 2026). Captions the next few photos in source-photos/
# with the CURRENT brief and prints them in this run's summary, next to the last three
# captions the account actually posted. Nothing is staged, rendered, posted or committed,
# and the photos are not touched. Run it from the Actions tab whenever the voice changes.
on:
  workflow_dispatch:
    inputs:
      count:
        description: "How many of the next photos to caption (nothing is posted)"
        default: "3"
        required: false

jobs:
  preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - run: pip install --quiet pillow pillow-heif
      - name: Caption the next photos (no post, no commit)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
        run: python autopost.py preview "${{ github.event.inputs.count }}"
