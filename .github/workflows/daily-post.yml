name: Daily social post

on:
  schedule:
    # THREE attempts across the 9–10am Costa Rica window. GitHub's scheduler often
    # delays or skips a single cron (worst at :00), so we give it 3 shots and an
    # "already posted today" guard in autopost.py ensures only the first one stages.
    - cron: "17 15 * * *"     # 9:17 AM Costa Rica
    - cron: "47 15 * * *"     # 9:47 AM Costa Rica
    - cron: "17 16 * * *"     # 10:17 AM Costa Rica
  workflow_dispatch:        # also runnable manually from the Actions tab
    inputs:
      force:
        description: "Stage a post even if one already went out today (bypass the daily guard)"
        type: boolean
        default: false

# This job only PREPARES + STAGES the post (renders it, writes a private pending post to
# Upstash, and WhatsApps you). It does NOT publish. You approve it on the dashboard, which
# triggers publish.yml. (Legacy auto-publish removed — approval is now the gate.)
jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # push the rendered image + staged state
      models: read          # GitHub's free AI for captions
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - run: pip install --quiet pillow pillow-heif
      - env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FORCE_POST: ${{ inputs.force && '1' || '' }}   # manual "Force" bypasses the daily guard
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}    # "post ready to approve" ping
          WHATSAPP_APIKEY: ${{ secrets.WHATSAPP_APIKEY }}
        run: python autopost.py prepare
