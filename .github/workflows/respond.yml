name: Engagement responder

on:
  schedule:
    # Comments + DMs are PRIORITY — they need a human, so the goal is to reach you
    # the soonest possible. Sweep at GitHub's floor of every 5 min. If a slot is
    # skipped (GitHub throttles high-frequency crons), the next slot catches it —
    # nothing is ever lost (idempotent via handled.json), so latency only ever
    # rounds up to the next run. Empty sweeps cost nothing (zero model calls when
    # there's nothing new), and a public repo has unlimited free minutes.
    - cron: "*/5 * * * *"     # every 5 minutes, around the clock
  workflow_dispatch:
    inputs:
      test_notify:
        description: "Send a test alert to all channels (ntfy/WhatsApp/etc.)"
        type: boolean
        default: false

jobs:
  respond:
    runs-on: ubuntu-latest
    permissions:
      contents: read           # checkout only — responder no longer commits to the repo
      issues: write            # open the PII-free "you have replies waiting" issue
      models: read             # GitHub Models for drafting
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Private inbox store (REQUIRED — keeps customer data out of the public repo):
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          # Notification fan-out — each lights up only if you add its secret:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}                 # phone push (reserved topic)
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}                 # ntfy access token (protects the topic)
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}         # WhatsApp (CallMeBot)
          WHATSAPP_APIKEY: ${{ secrets.WHATSAPP_APIKEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }} # Telegram
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}   # Slack/Discord webhook
          TEST_NOTIFY: ${{ inputs.test_notify && '1' || '' }}   # fire a test alert on demand
        run: python respond.py
