name: Post a reel

on:
  workflow_dispatch:            # run manually any time
  schedule:
    # Tue & Fri, off :00, with a backup attempt. A "one reel per day" guard in
    # reel.py ensures the backup never posts a second reel.
    - cron: "13 18 * * 2,5"     # Tue & Fri 12:13 Costa Rica
    - cron: "43 18 * * 2,5"     # Tue & Fri 12:43 Costa Rica (backup)

jobs:
  reel:
    runs-on: ubuntu-latest      # ffmpeg is preinstalled on this runner
    permissions:
      contents: write
      models: read              # free GitHub Models captioning (same as the photo poster)
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - run: pip install --quiet pillow pillow-heif cloudinary
      - env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
        run: python reel.py
