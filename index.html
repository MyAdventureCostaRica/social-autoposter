<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Adventure Costa Rica — Social Dashboard</title>
<meta name="description" content="My Adventure Costa Rica — social auto-poster mission control">
<!-- Self-hosted assets (no third-party requests) + iOS/Android home-screen app -->
<link rel="icon" type="image/png" href="logo-mark.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#F2EBD9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="My Adventure">
<style>
  @font-face{font-family:'Fraunces';src:url('fonts/fraunces-latin-standard-normal.ttf') format('truetype');font-weight:400 600;font-style:normal;font-display:swap}
  @font-face{font-family:'Fraunces';src:url('fonts/fraunces-latin-standard-italic.ttf') format('truetype');font-weight:400 600;font-style:italic;font-display:swap}
  @font-face{font-family:'DM Sans';src:url('fonts/dm-sans-latin-standard-normal.ttf') format('truetype');font-weight:400 600;font-style:normal;font-display:swap}
  :root{--sand:#F2EBD9;--sand-2:#EBE3D3;--bone:#F4EFE3;--ink:#0c100d;--clay:#5C4520;--clay-soft:#b08948;--forest:#169F48;--terracotta:#B85A20;--line:rgba(12,16,13,.12)}   /* mirrors the site tokens; forest = Pantone 149-8C (logo) */
  *{box-sizing:border-box}
  html{overflow-x:clip}                              /* no accidental sideways scroll of the page */
  body{margin:0;background:var(--sand);color:var(--ink);font-family:'DM Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1100px;margin:0 auto;padding:40px 24px 80px}
  h1{font-family:'Fraunces',serif;font-weight:500;font-size:34px;margin:0}
  .eyebrow{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--clay);font-weight:600}
  .top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;border-bottom:1px solid var(--line);padding-bottom:20px;margin-bottom:28px;flex-wrap:wrap}
  button{font-family:inherit;font-size:13px;border:1px solid var(--line);background:var(--bone);color:var(--ink);padding:9px 16px;border-radius:999px;cursor:pointer}
  button:hover{background:#fff}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px;margin-bottom:36px}
  .stat{background:var(--bone);border:1px solid var(--line);border-radius:14px;padding:20px}
  .stat .n{font-family:'Fraunces',serif;font-size:38px;line-height:1}
  .stat .l{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--clay);margin-top:8px;font-weight:600}
  h2{font-family:'Fraunces',serif;font-weight:500;font-size:22px;margin:36px 0 16px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px;align-items:start}
  .card{background:var(--bone);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .card img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:var(--sand-2)}
  .card .meta{padding:10px 12px;font-size:12px;color:var(--clay)}
  .card .meta b{color:var(--ink);font-weight:600}
  .card{position:relative;cursor:pointer}
  .cover{position:relative;aspect-ratio:1;overflow:hidden;background:var(--sand-2)}
  .cover img,.cover .ph{width:100%;height:100%;object-fit:cover;display:block}
  .play{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:42px;height:42px;border-radius:50%;background:rgba(12,16,13,.5);color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;padding-left:3px;pointer-events:none}
  .ph{display:flex;flex-direction:column;gap:6px;align-items:center;justify-content:center;background:linear-gradient(155deg,#12201a,var(--ink));color:var(--sand);text-align:center}
  .ph-g{font-size:30px;line-height:1;opacity:.92}
  .ph-l{font-size:10px;letter-spacing:.16em;text-transform:uppercase;opacity:.65}
  .ph-pub{width:220px;max-width:42vw;aspect-ratio:1;border-radius:10px;border:1px solid var(--clay-soft);flex:none}
  /* Recent posts: grid  ⇄  swipeable carousel ------------------------------- */
  #recCtl{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 16px}
  .rec-seg{display:inline-flex;border:1px solid var(--clay-soft);border-radius:999px;overflow:hidden}
  .rec-seg button{font:inherit;font-size:12.5px;font-weight:600;padding:7px 15px;border:0;background:#fff;color:var(--clay);cursor:pointer}
  .rec-seg button.on{background:var(--ink);color:var(--sand)}
  .rec-nav{display:inline-flex;gap:6px}
  .rec-arrow{width:36px;height:36px;border-radius:50%;border:1px solid var(--clay-soft);background:#fff;color:var(--ink);font-size:18px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .rec-arrow:hover{background:var(--sand)}
  .rec-arrow:disabled{opacity:.4;cursor:default}
  #recent.carousel{display:flex;grid-template-columns:none;overflow-x:auto;scroll-snap-type:x mandatory;gap:14px;align-items:flex-start;-webkit-overflow-scrolling:touch;padding-bottom:10px;scroll-padding-left:2px}
  #recent.carousel .card{flex:0 0 auto;width:min(80vw,300px);scroll-snap-align:start}
  .tag{position:absolute;top:8px;left:8px;background:rgba(12,16,13,.8);color:#fff;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:6px;z-index:1}
  .badge{width:100%;aspect-ratio:1;display:flex;align-items:center;justify-content:center;background:var(--sand);color:var(--clay);font-family:'Fraunces',serif;font-size:22px}
  .det{display:none;margin-top:10px}
  .card.open .det{display:block}
  .detail{width:100%;border-collapse:collapse;font-size:12px}
  .detail td{padding:3px 0;border-bottom:1px solid var(--line)}
  .detail td:last-child{text-align:right;font-weight:600}
  .cap{margin-top:10px;font-size:12px;color:var(--clay);white-space:pre-wrap;max-height:140px;overflow:auto}
  table{width:100%;border-collapse:collapse;background:var(--bone);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  th,td{text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);font-size:14px;white-space:nowrap}
  th{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--clay)}
  /* wide data tables scroll inside their own box (never the whole page); no data hidden */
  #bytype,#perf{max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:14px}
  tr:last-child td{border-bottom:none}
  .muted{color:var(--clay);font-size:14px}
  .note{background:var(--bone);border:1px dashed var(--clay-soft);border-radius:12px;padding:16px;color:var(--clay);font-size:14px;margin-top:12px}
  a{color:var(--forest)}
  .rv-banner{display:flex;align-items:center;gap:14px;background:var(--bone);border:1px solid var(--clay-soft);border-radius:12px;padding:12px 18px;margin-bottom:28px}
  .rv-banner a{margin-left:auto;font-size:13px;font-weight:600;white-space:nowrap}
  .new-pill{background:var(--clay);color:#fff;font-size:11px;font-weight:700;letter-spacing:.08em;padding:2px 9px;border-radius:999px;text-transform:uppercase}
  .review{background:var(--bone);border:1px solid var(--clay-soft);border-left:4px solid var(--clay);border-radius:14px;padding:20px 24px;margin-bottom:32px}
  .rv-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:6px}
  .rv-body h2,.rv-body h3,.rv-body h4{font-family:'Fraunces',serif;font-weight:500;margin:16px 0 6px;font-size:17px}
  .rv-body p{margin:8px 0;line-height:1.55}
  .rv-body ol,.rv-body ul{margin:8px 0;padding-left:22px}
  .rv-body li{margin:5px 0;line-height:1.5}
  .rv-body code{background:rgba(12,16,13,.06);padding:1px 6px;border-radius:5px;font-size:13px}
  .inbox-card{background:var(--bone);border:1px solid var(--clay-soft);border-left:4px solid var(--forest);border-radius:12px;padding:14px 18px;margin-bottom:14px}
  .ic-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
  .chip{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:rgba(12,16,13,.07);color:var(--clay)}
  .chip.dm{background:var(--clay);color:#fff}
  .ic-msg{margin:4px 0 10px;line-height:1.5}
  .ic-draft{background:rgba(176,137,72,.10);border-radius:9px;padding:10px 12px;line-height:1.5;position:relative}
  .ic-copy{position:absolute;top:8px;right:8px;font-size:12px;padding:3px 10px;border:1px solid var(--clay-soft);background:#fff;border-radius:7px;cursor:pointer}
  .mc-bar{background:var(--bone);border:1px solid var(--clay-soft);border-radius:12px;padding:14px 16px;margin-bottom:24px}
  .mc-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  /* buttons in a fixed grid — 6/3/2 columns (all factors of 6), so no row is ever ragged */
  .mc-actions{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
  .mc-status{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:2px 9px;border-radius:999px}
  .mc-status.on{background:var(--forest,#169F48);color:#fff}
  .mc-status.off{background:rgba(12,16,13,.10);color:var(--clay)}
  .mc-btn{font-size:13px;font-weight:600;padding:0 14px;height:34px;display:inline-flex;align-items:center;justify-content:center;white-space:nowrap;border:1px solid var(--clay-soft);background:#fff;color:var(--ink);border-radius:8px;cursor:pointer}
  .mc-btn:hover{background:var(--sand,#f2ebd9)}
  .mc-btn:disabled{opacity:.55;cursor:default}
  .mc-btn.send{background:var(--forest,#169F48);color:#fff;border-color:var(--forest,#169F48)}
  .mc-btn.ghost{border-style:dashed}
  .mc-runs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 18px;margin-top:10px;margin-bottom:24px}
  .mc-run{font-size:12.5px;line-height:1.5}
  .mc-run a{color:inherit;text-decoration:none;border-bottom:1px dotted var(--clay-soft)}
  .run-ok{color:var(--forest,#169F48);font-weight:700}
  .run-bad{color:#9E3B1B;font-weight:700}   /* terracotta, deepened — ✗ glyph carries the meaning */
  .run-go{color:var(--clay-soft);font-weight:700}
  .mc-gear{margin-left:auto;font-size:16px;background:none;border:none;cursor:pointer;color:var(--clay)}
  @media(max-width:960px){ .mc-actions{grid-template-columns:repeat(3,minmax(0,1fr))} }
  .mc-in{width:100%;max-width:420px;display:block;margin:6px 0;padding:8px 10px;border:1px solid var(--clay-soft);border-radius:8px;font-size:14px}
  .ic-edit{width:100%;box-sizing:border-box;margin:8px 0 4px;padding:9px 11px;border:1px solid var(--clay-soft);border-radius:9px;font:inherit;font-size:14px;line-height:1.5;background:#fff;resize:vertical}
  .ic-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .ic-post{display:flex;gap:11px;align-items:center;margin-bottom:11px;padding-bottom:11px;border-bottom:1px solid rgba(176,137,72,.28)}
  .ic-thumb{width:48px;height:48px;border-radius:8px;object-fit:cover;flex:none;display:block}
  .ic-post .badge{width:48px;height:48px;display:flex;align-items:center;justify-content:center;border-radius:8px;background:rgba(12,16,13,.08);color:var(--clay);font-size:11px;font-weight:700;flex:none}
  .ic-pcap{font-size:13px;line-height:1.4;max-height:2.9em;overflow:hidden;margin-top:2px}
  .modal-ov{position:fixed;inset:0;background:rgba(12,16,13,.45);display:flex;align-items:center;justify-content:center;z-index:9999}
  .modal{background:var(--bone);border:1px solid var(--clay-soft);border-radius:14px;padding:22px 24px;max-width:380px;box-shadow:0 14px 44px rgba(0,0,0,.28)}
  .modal p{margin:0 0 16px;line-height:1.5}
  .modal-btns{display:flex;gap:10px;justify-content:flex-end}
  #toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(18px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:all .25s ease;z-index:10000;max-width:80%}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .mc-toggle{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--clay);cursor:pointer;user-select:none;margin-top:12px}
  .mc-toggle input{width:16px;height:16px;accent-color:var(--forest,#169F48);cursor:pointer}
  .pending-card{background:var(--bone);border:1px solid var(--clay-soft);border-left:4px solid var(--clay);border-radius:14px;padding:18px 20px;margin-bottom:26px}
  .pp-imgs{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0 12px}
  .pp-thumb{width:128px;height:128px;object-fit:cover;border-radius:10px;flex:none;border:1px solid var(--clay-soft)}
  .pp-video{width:200px;max-height:356px;border-radius:10px;border:1px solid var(--clay-soft);background:var(--ink);flex:none}
  .pub-card{display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap;background:var(--bone);border:1px solid var(--clay-soft);border-radius:14px;padding:18px;margin-bottom:28px}
  .pub-img{width:220px;max-width:42vw;aspect-ratio:1;object-fit:cover;border-radius:10px;border:1px solid var(--clay-soft);display:block;flex:none}
  .pub-body{flex:1;min-width:240px}
  .pub-cap{font-size:14px;line-height:1.65;margin:10px 0 12px;white-space:pre-wrap}
  .rv-head{display:flex;align-items:center;gap:12px;cursor:pointer;user-select:none;padding:16px 22px}
  .rv-chev{margin-left:auto;color:var(--clay);font-size:13px}
  .rv-body{padding:0 22px 18px;line-height:1.6}
  .rv-modal{max-width:760px;width:calc(100vw - 48px);max-height:82vh;display:flex;flex-direction:column}
  .rv-mbody{overflow:auto;line-height:1.6;margin:6px 0 14px;padding-right:8px}
  .pp-edit{width:100%;box-sizing:border-box;margin:6px 0 10px;padding:11px 13px;border:1px solid var(--clay-soft);border-radius:10px;font:inherit;font-size:14px;line-height:1.55;background:#fff;resize:vertical;white-space:pre-wrap}

  /* ---- Phone / home-screen app (iPhone 17 Pro Max & friends) ---------------- */
  @media (max-width:640px){
    /* safe-area insets so nothing hides under the Dynamic Island or home bar */
    .wrap{padding:calc(env(safe-area-inset-top,0px) + 14px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 28px) max(16px,env(safe-area-inset-left,0px))}
    h1{font-size:26px}
    h2{font-size:20px;margin:26px 0 14px}
    .top{align-items:center;margin-bottom:18px;padding-bottom:16px}
    .top img{height:38px!important}
    .top>button{min-height:40px}
    .mc-bar{padding:12px}
    .mc-actions{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}  /* 2-up, even */
    .mc-actions .mc-btn{height:44px}                    /* thumb-sized targets */
    .mc-gear{font-size:20px}
    .mc-toggle{min-height:34px}
    .mc-runs{grid-template-columns:1fr;margin-bottom:20px}
    .mc-run{min-height:46px}   /* reserve 2 lines so skeleton→real never reflows (no page shift) */
    .mc-in{max-width:none}
    .stats{gap:12px;margin-bottom:26px}
    .stat{padding:16px}
    .stat .n{font-size:32px}
    .pub-card{padding:14px;gap:14px}
    .pub-img,.ph-pub{width:100%;max-width:none}         /* see the whole post, big */
    .pub-body{min-width:0}
    .grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
    .rv-head{padding:14px 16px}
    .rv-body{padding:0 16px 16px}
    .modal{padding:18px 16px}
    .pp-imgs img,.pp-thumb{max-width:46vw}
    /* comfortable tap targets on every action button */
    .mc-btn,.ic-actions button{min-height:40px}
    /* tighter data-table cells so they fit (or scroll minimally) on a phone */
    th,td{padding:9px 10px;font-size:12.5px}
  }
  /* let the just-posted image breathe on small tablets too */
  @media (max-width:820px) and (min-width:641px){ .pub-img{width:180px} }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div style="display:flex;align-items:center;gap:14px">
      <img src="logo-mark.png" alt="My Adventure Costa Rica" style="height:44px;width:auto" onerror="this.style.display='none'">
      <div>
        <div class="eyebrow">My Adventure Costa Rica</div>
        <h1>Social Dashboard</h1>
      </div>
    </div>
    <button onclick="load(true)">↻ Refresh</button>
  </div>
  <div class="stats" id="stats"></div>
  <div id="audience" class="muted" style="font-size:13px;margin:-14px 0 30px"></div>
  <div id="controls"></div>
  <div id="pending"></div>
  <div id="pendingReel"></div>
  <div id="published"></div>
  <div id="review-top"></div>
  <div id="inbox"></div>
  <h2>Recent posts</h2>
  <div id="recCtl"></div>
  <div class="grid" id="recent"><div class="muted">Loading…</div></div>
  <h2>By post type <span class="muted" style="font-size:13px">— how each format performs</span></h2>
  <div id="bytype"></div>
  <h2>Top performers <span class="muted" style="font-size:13px">— by reach + shares</span></h2>
  <div id="perf"></div>
  <div id="review-full" style="scroll-margin-top:16px;margin-top:44px"></div>
  <p class="muted" id="updated" style="margin-top:40px"></p>
</div>
<script>
const REPO='MyAdventureCostaRica/social-autoposter', BRANCH='main';
const RAW=`https://raw.githubusercontent.com/${REPO}/${BRANCH}`;
const API=`https://api.github.com/repos/${REPO}/contents`;
async function j(u){try{const r=await fetch(u,{cache:'default'});if(!r.ok)return null;return await r.json();}catch(e){return null;}}
function imgExt(n){return /\.(jpe?g|png)$/i.test(n);}
function photoExt(n){return /\.(jpe?g|png|heic|heif)$/i.test(n);}
function imgFail(el,label){el.outerHTML='<div class="badge">'+label+'</div>';}
// Branded placeholder for a post with no cover image (a reel/carousel/story whose
// IG thumbnail we don't have yet). Looks intentional, not broken.
function coverPlaceholder(fmt,big){
  const g={reel:'▶',video:'▶',carousel:'▧',story:'◱'}[fmt]||'❖';
  const l={reel:'Reel',video:'Video',carousel:'Carousel',story:'Story',single:'Post'}[fmt]||'Post';
  return `<div class="ph${big?' ph-pub':''}"><span class="ph-g">${g}</span><span class="ph-l">${l}</span></div>`;
}
// Walk the ordered cover candidates on load error; brand-placeholder when exhausted.
function nextCover(img){
  let list=[]; try{ list=JSON.parse(img.getAttribute('data-srcs')||'[]'); }catch(e){}
  if(list.length){ img.setAttribute('data-srcs',JSON.stringify(list.slice(1))); img.src=list[0]; return; }
  img.outerHTML=coverPlaceholder(img.getAttribute('data-fmt')||'post');
}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function md(t){
  const lines=esc(t).split('\n'); let html='', list=null;
  const inline=s=>s.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`(.+?)`/g,'<code>$1</code>');
  const close=()=>{ if(list){html+=`</${list}>`; list=null;} };
  for(const ln of lines){
    if(/^#{1,6}\s/.test(ln)){ close(); const lvl=Math.min(ln.match(/^#+/)[0].length+1,4); html+=`<h${lvl}>${inline(ln.replace(/^#+\s/,''))}</h${lvl}>`; continue; }
    let m=ln.match(/^\s*\d+\.\s+(.*)/);
    if(m){ if(list!=='ol'){close();html+='<ol>';list='ol';} html+=`<li>${inline(m[1])}</li>`; continue; }
    m=ln.match(/^\s*[-*]\s+(.*)/);
    if(m){ if(list!=='ul'){close();html+='<ul>';list='ul';} html+=`<li>${inline(m[1])}</li>`; continue; }
    if(ln.trim()===''){ close(); continue; }
    close(); html+=`<p>${inline(ln)}</p>`;
  }
  close(); return html;
}
function markSeen(when){ try{localStorage.setItem('lastSeenReview',when);}catch(e){}
  const p=document.querySelector('.new-pill'); if(p)p.remove();
  document.title=document.title.replace(/^●\s*/,''); }
// Review UX (Esteban, Jul 22): no banner. A NEW review opens as a clearable
// popup (any close marks it read); the bottom section is a collapsible card —
// expanded while new, collapsed once read (click the header to reopen).
function renderReview(rv){
  const top=document.getElementById('review-top'), full=document.getElementById('review-full');
  if(!top||!full) return;
  top.innerHTML='';
  if(!rv||!rv.markdown){ full.innerHTML=''; return; }
  window._lastReview=rv;
  const when=(rv.stats&&rv.stats.generated)||'';
  let seen=null; try{seen=localStorage.getItem('lastSeenReview');}catch(e){}
  const isNew = when && when!==seen;
  full.innerHTML=`<div class="review" style="padding:0;overflow:hidden">`
    +`<div class="rv-head" onclick="toggleReview()">`
    +`<span class="eyebrow">Monthly review · ${when}</span>`
    +(isNew?`<span class="new-pill">New</span>`:``)
    +`<span class="muted" style="font-size:12px">reply to Claude to apply</span>`
    +`<span class="rv-chev" id="rvChev">${isNew?'▲':'▼'}</span></div>`

async function compressVideo(file, onProg){
  // Native MediaRecorder re-encode. No wasm, no SharedArrayBuffer, nothing to download.
  // Plays the clip once and records it at a bitrate sized to land under the 100 MB cap,
  // so it takes roughly the length of the video.
  if(typeof MediaRecorder==='undefined') throw new Error('This browser cannot re-encode video');
  const url=URL.createObjectURL(file);
  const v=document.createElement('video');
  v.src=url; v.playsInline=true; v.preload='auto'; v.setAttribute('playsinline','');
  v.style.cssText='position:fixed;left:0;top:0;width:2px;height:2px;opacity:0.01;pointer-events:none;z-index:-1';
  document.body.appendChild(v);
  const cleanup=()=>{ try{v.pause();}catch(e){} try{v.remove();}catch(e){} try{URL.revokeObjectURL(url);}catch(e){} };
  try{
    await new Promise((res,rej)=>{ v.onloadedmetadata=()=>res(); v.onerror=()=>rej(new Error('Could not read this video')); });
    let dur=v.duration;
    if(!isFinite(dur)||!dur){                      // some recordings only report duration after a seek
      dur=await new Promise(res=>{ v.onseeked=()=>res(isFinite(v.duration)?v.duration:60); try{ v.currentTime=1e6; }catch(e){ res(60); } });
      try{ v.currentTime=0; }catch(e){}
    }
    dur=Math.max(1, dur||60);
    if(!v.captureStream && !v.mozCaptureStream) throw new Error('This browser cannot re-encode video');
    const MIMES=['video/mp4;codecs=avc1.42E01E,mp4a.40.2','video/mp4','video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'];
    const mime=MIMES.find(m=>{ try{ return MediaRecorder.isTypeSupported(m); }catch(e){ return false; } })||'';
    const run=async(vbr)=>{
      try{ v.currentTime=0; }catch(e){}
      // warm the decoder so captureStream() hands back live tracks
      try{ await v.play(); }
      catch(e){ v.muted=true; try{ await v.play(); }catch(e2){ throw new Error('The browser blocked playback'); } }
      v.pause(); try{ v.currentTime=0; }catch(e){}
      const stream=(v.captureStream? v.captureStream() : v.mozCaptureStream());
      const opts=Object.assign({videoBitsPerSecond:vbr, audioBitsPerSecond:128000}, mime?{mimeType:mime}:{});
      const rec=new MediaRecorder(stream, opts);
      const chunks=[]; rec.ondataavailable=e=>{ if(e.data&&e.data.size) chunks.push(e.data); };
      const stopped=new Promise(res=>{ rec.onstop=()=>res(); });
      const tick=setInterval(()=>{ if(onProg) onProg(Math.min(0.99,(v.currentTime||0)/dur)); },250);
      rec.start(1000);
      await v.play();
      await Promise.race([
        new Promise(res=>{ v.onended=()=>res(); }),
        new Promise(res=> setTimeout(res, dur*1000+30000))     // never hang forever
      ]);
      clearInterval(tick);
      try{ rec.stop(); }catch(e){}
      await stopped;
      if(onProg) onProg(1);
      return new Blob(chunks,{type:mime||'video/webm'});
    };
    let vbr=Math.floor(80*1024*1024*8/dur)-128000;
    vbr=Math.max(500000, Math.min(vbr, 6000000));
    let blob=await run(vbr);
    if(blob.size>95*1024*1024) blob=await run(Math.max(400000, Math.floor(vbr*0.55)));
    if(!blob.size) throw new Error('Re-encode produced an empty file');
    const ext=(blob.type.indexOf('mp4')>-1)?'mp4':'webm';
    const nm=(file.name.replace(/\.[^.]+$/,'')||'video');
    return new File([blob], nm+'-web.'+ext, {type:blob.type||('video/'+ext)});
  } finally { cleanup(); }
}
async function doUpload(file){
  const st=()=>document.getElementById('upStat');
  const isVid=/^video\//.test(file.type)|| /\.(mp4|mov|m4v|webm)$/i.test(file.name);
  const MAXV=100*1024*1024, MAXI=10*1024*1024, mb=Math.round(file.size/1048576);
  if(!isVid && file.size>MAXI){ uiToast('Image is '+mb+' MB \u2014 the max is 10 MB. Export a smaller version and try again.'); return; }
  if(isVid && file.size>95*1024*1024){
    if(st()) st().textContent='Compressing video\u2026 (takes about the length of the clip \u2014 keep this tab open)';
    try{ file = await compressVideo(file, r=>{ if(st()) st().textContent='Compressing video\u2026 '+Math.round(r*100)+'% (keep this tab open)'; }); }
    catch(e){ console.error(e); uiToast('Couldn\u2019t auto-compress this video \u2014 trim/export it under 100 MB and retry.'); if(st())st().textContent=''; return; }
    if(file.size>MAXV){ uiToast('Still over 100 MB after compressing \u2014 it is a very long clip; trim it and retry.'); if(st())st().textContent=''; return; }
  }
  if(st()) st().textContent='Preparing upload\u2026';
  let cfg2=null; try{ const r=await ctrl('upload_config',{}); if(r&&r.ok) cfg2=r; }catch(e){}
  if(!cfg2||!cfg2.cloudName||!cfg2.preset){ uiToast('Upload isn\u2019t set up yet \u2014 add the Cloudinary preset (I\u2019ll guide you).'); if(st())st().textContent=''; return; }
  const fd=new FormData();
  fd.append('file',file);
  fd.append('upload_preset',cfg2.preset);
  if(isVid) fd.append('folder','Reels');
  const ep=`https://api.cloudinary.com/v1_1/${cfg2.cloudName}/${isVid?'video':'image'}/upload`;
  const xhr=new XMLHttpRequest(); xhr.open('POST',ep);
  xhr.upload.onprogress=e=>{ if(e.lengthComputable&&st()) st().textContent='Uploading '+(isVid?'video':'photo')+'\u2026 '+Math.round(e.loaded/e.total*100)+'%'; };
  xhr.onload=async()=>{
    if(xhr.status>=200&&xhr.status<300){
      let j={}; try{ j=JSON.parse(xhr.responseText); }catch(e){}
      if(st()) st().textContent='Uploaded \u2014 captioning & rendering\u2026';
      const r=await ctrl('ingest',{resource_type:j.resource_type||(isVid?'video':'image'),secure_url:j.secure_url,public_id:j.public_id});
      if(r&&r.ok){
        uiToast((isVid?'Video':'Photo')+' uploaded \u2713 \u2014 it\u2019ll appear below to approve in ~1 min');
        if(st()) setTimeout(()=>{ if(st()) st().textContent=''; },8000);
        setTimeout(()=>{ if(connected()) renderLive(true); }, 45000);
      } else { uiToast('Ingest failed: '+((r&&r.error)||'error')); if(st())st().textContent=''; }
    } else { uiToast('Upload failed ('+xhr.status+')'); if(st())st().textContent=''; }
  };
  xhr.onerror=()=>{ uiToast('Upload error \u2014 check your connection'); if(st())st().textContent=''; };
  xhr.send(fd);
}

function fmtRel(iso){
  if(!iso) return '\u2014';
  let s=(Date.now()-new Date(iso).getTime())/1000; if(s<0)s=0;
  if(s<60) return 'just now';
  const m=s/60; if(m<60) return Math.floor(m)+'m ago';
  const h=m/60; if(h<24) return Math.floor(h)+'h ago';
  const d=h/24; if(d<7) return Math.floor(d)+'d ago';
  return new Date(iso).toLocaleDateString();
}

function renderRuns(){

    if(it.empty){ html+=`<div class="mc-run"><a href="${it.link}" target="_blank" rel="noopener"><b>${it.name}</b></a> <span class="muted">never run</span></div>`; continue; }
    let state;

      state=`<span class="run-go">●</span> running…${prog} · started ${fmtRel(new Date(it.start).toISOString())}`;
    } else {

async function loadRunStatus(){
  const box=document.getElementById('mcRuns'); if(!box) return;
  let data={}; try{ data=await fetchRuns(); }catch(e){ data={}; }
  let anyRunning=false;
  _runState=Object.keys(RUN_WF).map(k=>{
    const w=RUN_WF[k]; const runs=data[k]||[];
    const link=`https://github.com/${REPO}/actions/workflows/${w.file}`;
    if(!runs.length) return {name:w.name,link,empty:true};
    const last=runs[0];
    const start=new Date(last.run_started_at||last.created_at).getTime();
    const running=!!(last.status&&last.status!=='completed'); if(running) anyRunning=true;
    const succ=runs.find(r=>r.conclusion==='success');
    // Duration estimate for the % readout, from ALL completed runs we can see.
    // Median (robust to outliers), preferring real work: successes ≥45s (guard-skip
    // runs finish in seconds and would drag the estimate); then any success; then
    // any completed run; then a per-workflow prior so a % always shows (the review
    // runs once a month — its history is mostly skips, so it never had an avg).
    const dur=r=>(r.run_started_at&&r.updated_at)?(new Date(r.updated_at)-new Date(r.run_started_at)):0;
    const med=a=>{ if(!a.length) return 0; const s=a.slice().sort((x,y)=>x-y); return s[Math.floor(s.length/2)]; };
    const done=runs.filter(r=>r.status==='completed');
    const succD=done.filter(r=>r.conclusion==='success').map(dur).filter(d=>d>0);
    const avg=med(succD.filter(d=>d>=45000))||med(succD)||med(done.map(dur).filter(d=>d>0))
      ||({insights:240000,post:150000,reel:180000,responder:35000,review:90000,publish:120000}[k]||90000);
    return {key:k,name:w.name,link,running,start,avg,ok:last.conclusion==='success',succWhen:succ?succ.updated_at:null};
  });
  renderRuns();
  liveRefresh();
  if(_runTimer) clearTimeout(_runTimer);
  const conn=connected();
  const ms=anyRunning?(conn?10000:30000):(conn?30000:300000);
  _runTimer=setTimeout(loadRunStatus, ms);
  if(anyRunning && !_runTick) _runTick=setInterval(renderRuns,1000);
  if(!anyRunning && _runTick){ clearInterval(_runTick); _runTick=null; }
}
// LIVE UPDATES: when any workflow finishes — button, Vercel cron, or GitHub
// schedule, they all surface through the same run poll — pull its output into
// the page right away. No reload, ever.
function liveRefresh(){
  window._lastDone=window._lastDone||{};
  for(const it of _runState){
    if(!it||it.empty||it.running||!it.key) continue;
    const fp=it.start+':'+(it.ok?'1':'0');
    const prev=window._lastDone[it.key];
    window._lastDone[it.key]=fp;
    if(prev===undefined||prev===fp||!it.ok) continue;   // first poll, unchanged, or a failed run
    if(it.key==='review') refreshReview();
    else if(it.key==='post'||it.key==='reel') renderLive(true);   // approval card appears
    else if(it.key==='responder') refreshInbox();
    else load(true);                                    // insights / publish: fresh data everywhere
  }
}

// ---- Audience by country: today's mix + the trend over time ------------------
// History = metrics/audience-history.json, one entry per day (fetch_insights.py
// appends on each Daily insights run; the snapshot audience.json alone is
// overwritten). Rides the same live-refresh path as everything else.
// Series colors: BRAND-LED, validated (dataviz six-checks) on this page's bone
// surface #F4EFE3 — terracotta (site --terracotta) and forest (Pantone 149-8C,
// the logo green) carry slots 1+3, separated by a derived petrol blue because
// terracotta↔forest adjacent fails deutan (ΔE 4.8); plum + gold (clay-soft with
// the chroma raised to clear the gray floor) complete the set. Worst adjacent
// CVD ΔE 11.2, normal-vision 21.8; the gold's contrast WARN is relieved by
// direct end-labels + legend + tooltip. A pure-brand five (clay, clay-soft,
// forest-mid…) is unshippable: clay-soft↔forest reads IDENTICAL to protan
// viewers (ΔE 2.3) and clay fails the lightness band — don't retry it.
const AUD_COLORS=['#B85A20','#3579B0','#169F48','#9C5477','#D69A2D'];
function _flag(c){return (c&&c.length===2)?String.fromCodePoint(...[...c.toUpperCase()].map(ch=>127397+ch.charCodeAt(0))):'';}
function renderAudience(aud,hist){
  const el=document.getElementById('audience'); if(!el) return;
  window._audData={aud,hist};                        // stash for re-draw on rotate/resize
  if(!window._audResize){ window._audResize=1; addEventListener('resize',()=>{ clearTimeout(window._audT);
    window._audT=setTimeout(()=>{ if(window._audData) renderAudience(window._audData.aud,window._audData.hist); },220); }); }
  if(!(aud&&Array.isArray(aud.countries)&&aud.countries.length)){ el.innerHTML=''; return; }
  const label=aud.metric==='followers'?'Followers by country':'Reach by country · last 90 days';
  let html=`<b>${label}:</b> `+aud.countries.slice(0,7).map(c=>`${_flag(c.code)} ${esc(c.code)} ${c.pct}%`).join('  ·  ');
  const rows=(Array.isArray(hist)?hist:[]).filter(h=>h&&h.metric===aud.metric&&h.date&&Array.isArray(h.countries))
    .sort((a,b)=>a.date.localeCompare(b.date));
  if(rows.length<2){
    html+=`<div class="muted" style="font-size:12px;margin-top:6px">Country trend: recording daily${rows.length?` since ${rows[0].date}`:''} — the chart draws once two days of history exist.</div>`;
    el.innerHTML=html; return;
  }
  const latest=rows[rows.length-1];
  const top=latest.countries.slice().sort((a,b)=>b.pct-a.pct).slice(0,5).map(c=>c.code);
  const at=(r,c)=>{const f=(r.countries||[]).find(x=>x.code===c);return f?f.pct:null;};
  // viewBox width tracks the actual container so SVG text renders ~1:1 at any
  // width — on a phone a fixed 860-wide viewBox shrank labels to ~5px.
  const cw=Math.round(el.clientWidth||900), narrow=cw<470;
  const W=Math.max(300,Math.min(1100,cw)), H=narrow?248:230;
  const L=narrow?28:38, R=narrow?70:66, T=14, B=narrow?30:26, PW=W-L-R, PH=H-T-B;
  const fAx=10, fEnd=11, gap=fEnd+3;
  const ymax=Math.max(10,Math.ceil(Math.max(...rows.map(r=>Math.max(...top.map(c=>at(r,c)||0))))*1.12));
  const X=i=>L+i*PW/(rows.length-1), Y=v=>T+PH-(v/ymax)*PH;
  let g='';
  for(let i=0;i<=3;i++){const v=Math.round(ymax*i/3);
    g+=`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="1"/>`
      +`<text x="${L-6}" y="${Y(v)+3.5}" text-anchor="end" font-size="${fAx}" fill="var(--clay)">${v}%</text>`;}
  const xt=[...new Set([0,Math.floor((rows.length-1)/2),rows.length-1])];
  for(const i of xt) g+=`<text x="${X(i)}" y="${H-8}" text-anchor="middle" font-size="${fAx}" fill="var(--clay)">${rows[i].date.slice(5)}</text>`;
  let s='';const labs=[];
  top.forEach((c,si)=>{
    const col=AUD_COLORS[si%AUD_COLORS.length];
    const pts=rows.map((r,i)=>({i,v:at(r,c)})).filter(p=>p.v!=null);
    if(!pts.length) return;
    s+=`<path d="${pts.map((p,n)=>(n?'L':'M')+X(p.i).toFixed(1)+' '+Y(p.v).toFixed(1)).join(' ')}" fill="none" stroke="${col}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>`;
    if(si<4){const lp=pts[pts.length-1];labs.push({c,v:lp.v,y:Y(lp.v)});}
  });
  labs.sort((a,b)=>a.y-b.y);                       // de-overlap end labels
  for(let i=1;i<labs.length;i++) if(labs[i].y<labs[i-1].y+gap) labs[i].y=labs[i-1].y+gap;
  const ends=labs.map(l=>`<text x="${W-R+6}" y="${l.y+3.5}" font-size="${fEnd}" font-weight="600" fill="var(--ink)">${esc(l.c)} ${l.v}%</text>`).join('');
  const legend=top.map((c,si)=>`<span style="display:inline-flex;align-items:center;gap:5px;margin-right:14px">`
    +`<span style="width:10px;height:10px;border-radius:3px;background:${AUD_COLORS[si%AUD_COLORS.length]};display:inline-block"></span>`
    +`<span style="font-size:11px;font-weight:600">${_flag(c)} ${esc(c)}</span></span>`).join('');
  html+=`<div style="margin-top:10px;margin-bottom:2px">${legend}<span class="muted" style="font-size:11px"> · share of ${esc(aud.metric)} per day</span></div>`
    +`<div style="position:relative" id="audTrendWrap">`
    +`<svg id="audTrendSvg" viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">${g}${s}`
    +`<line id="audCross" y1="${T}" y2="${T+PH}" x1="-9" x2="-9" stroke="var(--clay-soft)" stroke-width="1" style="display:none"/>${ends}</svg>`
    +`<div id="audTip" style="display:none;position:absolute;top:8px;pointer-events:none;background:var(--bone);border:1px solid var(--clay-soft);border-radius:9px;padding:7px 10px;font-size:11.5px;line-height:1.65;box-shadow:0 6px 18px rgba(12,16,13,.14);font-variant-numeric:tabular-nums;white-space:nowrap"></div></div>`;
  el.innerHTML=html;
  const svg=document.getElementById('audTrendSvg'),tip=document.getElementById('audTip'),
        cross=document.getElementById('audCross'),wrap=document.getElementById('audTrendWrap');
  const show=clientX=>{
    const rct=svg.getBoundingClientRect();
    let i=Math.round(((clientX-rct.left)*(W/rct.width)-L)/(PW/(rows.length-1)));
    i=Math.max(0,Math.min(rows.length-1,i));
    cross.setAttribute('x1',X(i)); cross.setAttribute('x2',X(i)); cross.style.display='';
    tip.innerHTML=`<b>${rows[i].date}</b><br>`+top.map((c,si)=>{const v=at(rows[i],c);
      return v==null?'':`<span style="color:${AUD_COLORS[si%AUD_COLORS.length]}">●</span> ${esc(c)} ${v}%`;}).filter(Boolean).join('<br>');
    tip.style.display='block';
    const wr=wrap.getBoundingClientRect();
    let px=(X(i)/W)*wr.width+12; if(px+tip.offsetWidth+8>wr.width) px=px-24-tip.offsetWidth;
    tip.style.left=Math.max(0,px)+'px';
  };
  const hide=()=>{tip.style.display='none';cross.style.display='none';};
  svg.addEventListener('mousemove',ev=>show(ev.clientX));
  svg.addEventListener('mouseleave',hide);
  // touch: tap-drag the chart to read any day (mobile has no hover)
  svg.addEventListener('touchstart',ev=>{ if(ev.touches[0]) show(ev.touches[0].clientX); },{passive:true});
  svg.addEventListener('touchmove', ev=>{ if(ev.touches[0]) show(ev.touches[0].clientX); },{passive:true});
  svg.addEventListener('touchend',()=>setTimeout(hide,1800));
}

async function load(isRefresh){

  const [counts,insights,posts,review,aud,audHist,follHist]=await Promise.all([
    j(`${RAW}/metrics/counts.json${cb}`),
    j(`${RAW}/metrics/insights.json${cb}`), j(`${RAW}/metrics/posts.json${cb}`),
    j(`${RAW}/metrics/review-latest.json${cb}`), j(`${RAW}/metrics/audience.json${cb}`),
    j(`${RAW}/metrics/audience-history.json${cb}`), j(`${RAW}/metrics/followers-history.json${cb}`)
  ]);
  if(!isRefresh) renderControls();
  // base -> Instagram thumbnail, so the "Just posted" banner can always show a
  // preview even for records saved before the publish-time thumbnail existed.
  window._thumbByBase={}; window._postsById={};
  (Array.isArray(posts)?posts:[]).forEach(p=>{ if(p&&p.base&&p.thumb) window._thumbByBase[p.base]=p.thumb;
    if(p&&p.id) window._postsById[p.id]=p; });
  renderLive(false);
  if(!window._livePoll){ window._livePoll=setInterval(()=>{ if(connected()) renderLive(true); }, 30000); }
  let reviewObj=review;   // prefer the instant backend copy over the CDN-cached raw file
  if(connected()){ try{ const rr=await ctrl('review',{}); if(rr&&rr.ok&&rr.review) reviewObj=rr.review; }catch(e){} }
  renderReview(reviewObj);
  const postsById=window._postsById;   // built above; also used by live inbox refreshes
  // Inbox is PRIVATE: it never touches the public repo. Load it through the
  // authenticated backend (api/control "inbox"). Requires you to be connected.
  const inboxEl=document.getElementById('inbox');
  if(connected()){
    const r=await ctrl('inbox',{});
    if(r&&r.ok){ window._inboxKey=JSON.stringify(r.inbox||[]);
      if(!(isRefresh&&inboxBusy())) renderInbox(r.inbox||[], r.resolutions||{}, postsById); }
    else if(inboxEl){ inboxEl.innerHTML='<p class="muted" style="margin-top:8px">Could not load the inbox — check your connection details.</p>'; }
  } else if(inboxEl){
    inboxEl.innerHTML='<p class="muted" style="margin-top:8px">Connect mission control (above) to view and reply to your inbox.</p>';
  }
  const queue=(counts&&counts.queued)||0;
  // Posts published = real posts on the account (feed + reels + carousels, excluding
  // ephemeral stories), from the feed the dashboard already loads — matches the
  // Instagram profile grid. The old counts.posted only counted image files in the
  // repo's posted/ folder, so it missed every reel/story/carousel (showed 7 of 784).
  const postedCount=Array.isArray(posts)
    ? posts.filter(p=>p&&(p.format||'')!=='story').length
    : ((counts&&counts.posted)||0);
  const ins=Array.isArray(insights)?insights:[];
  const totalShares=ins.reduce((a,b)=>a+(b.shares||0),0);
  // A single "avg reach" lies here: photo posts reach ~30, reels ~450, stories a
  // handful. So we show a TOTAL (reach in the last 30d, no averaging distortion)
  // + the reels number on its own (the reach engine) + the follower north-star.
  const fmtOf=x=>((window._postsById&&window._postsById[x.id]||{}).format||x.format||'');
  const daysAgo=iso=>{ if(!iso) return 1e9; const d=(Date.now()-new Date(iso).getTime())/86400000; return d>=0?d:1e9; };
  const feed=ins.filter(x=>typeof x.reach==='number'&&fmtOf(x)!=='story');
  const reach30=feed.filter(x=>daysAgo(x.date)<=30).reduce((a,b)=>a+b.reach,0);
  const reels90=ins.filter(x=>fmtOf(x)==='reel'&&typeof x.reach==='number'&&daysAgo(x.date)<=90);
  const reelReach=reels90.length?Math.round(reels90.reduce((a,b)=>a+b.reach,0)/reels90.length):null;
  const followers=(counts&&typeof counts.followers==='number')?counts.followers
                  :((aud&&typeof aud.total==='number')?aud.total:null);
  // follower growth (~30d) only from REAL follower counts in history — never the
  // located-followers fallback, so the fallback can't fake a jump.
  let follSub='',follUp=true;
  if(Array.isArray(follHist)&&follHist.length&&counts&&typeof counts.followers==='number'){
    const past=follHist.filter(h=>h&&typeof h.followers==='number'&&daysAgo(h.date)>=20)
      .sort((a,b)=>Math.abs(daysAgo(a.date)-30)-Math.abs(daysAgo(b.date)-30))[0];
    if(past){ const d=counts.followers-past.followers; follUp=d>=0; follSub=(d>=0?'▲ +':'▼ ')+Math.abs(d)+' · 30d'; }
  }
  const tiles=[
    {n: followers!=null?followers.toLocaleString():'—', l:'Followers', sub:follSub, up:follUp},
    {n: postedCount.toLocaleString(), l:'Posts published'},
    {n: reach30.toLocaleString(), l:'Reach · 30d'},
    {n: reelReach!=null?reelReach.toLocaleString():'—', l:'Avg reel reach'},
    {n: totalShares||'—', l:'Total shares'},
    {n: queue.toLocaleString(), l:'Photos queued'},
  ];
  document.getElementById('stats').innerHTML=tiles.map(t=>
    `<div class="stat"><div class="n">${t.n}</div><div class="l">${t.l}</div>`
    +(t.sub?`<div class="l" style="margin-top:4px;letter-spacing:.04em;color:${t.up?'var(--forest)':'var(--terracotta)'}">${t.sub}</div>`:'')
    +`</div>`).join('');
  renderAudience(aud,audHist);

  // recent posts — EVERY type, newest first, with stats + a click-to-expand detail
  const capById={},urlById={},tsById={}; (Array.isArray(posts)?posts:[]).forEach(p=>{if(p.id){capById[p.id]=p.caption||'';urlById[p.id]=p.thumb||'';tsById[p.id]=p.ts||p.date||'';}});
  const recentPosts=ins.slice().filter(x=>x.date).sort((a,b)=>(''+(tsById[b.id]||b.date)).localeCompare(''+(tsById[a.id]||a.date)));
  const badge={reel:'Reel',story:'Story',carousel:'Carousel',single:'Post',video:'Video'};
  const fnum=n=>typeof n==='number'?n.toLocaleString():null;
  const keyStats=x=>{const b=[];if(fnum(x.reach))b.push(`<b>${fnum(x.reach)}</b> reach`);if(fnum(x.views))b.push(`<b>${fnum(x.views)}</b> views`);if(x.shares)b.push(`<b>${x.shares}</b> shares`);return b.join(' · ')||(x.error?'no insights for this one':'—');};
  const allStats=x=>{const skip=new Set(['id','date','base','format','category','pillar','error','interactions','eng_rate']);
    const rows=Object.keys(x).filter(k=>!skip.has(k)&&typeof x[k]==='number').sort().map(k=>`<tr><td>${k.replace(/_/g,' ')}</td><td>${x[k].toLocaleString()}</td></tr>`).join('');
    const er=typeof x.eng_rate==='number'?`<tr><td>engagement rate</td><td>${(x.eng_rate*100).toFixed(1)}%</td></tr>`:'';
    return (rows||er)?`<table class="detail">${rows}${er}</table>`:'<div class="muted" style="font-size:12px">No insights captured for this one.</div>';};
  document.getElementById('recent').innerHTML = recentPosts.length? recentPosts.map(x=>{
    const base=x.base||''; const fmt=x.format||'single';
    const storyBase=base.replace(/-story$/,'');
    const enc=encodeURIComponent;
    // Ordered cover candidates — IG thumbnail first (works for reels + carousels
    // once fetch_insights captures them), then our rendered file, then a branded
    // placeholder. Each src is tried in turn via nextCover() on error.
    const srcs=[];
    if(fmt==='story'){ if(base) srcs.push(`${RAW}/rendered/${enc(storyBase)}_story.jpg`); if(urlById[x.id]) srcs.push(urlById[x.id]); }
    else { if(urlById[x.id]) srcs.push(urlById[x.id]); if(base) srcs.push(`${RAW}/rendered/${enc(base)}_1.jpg`); }
    const cover=srcs.length
      ? `<img loading="lazy" referrerpolicy="no-referrer" data-fmt="${fmt}" data-srcs='${escA(JSON.stringify(srcs.slice(1)))}' src="${escA(srcs[0])}" onerror="nextCover(this)">`
      : coverPlaceholder(fmt);
    const play=(srcs.length&&(fmt==='reel'||fmt==='video'))?`<span class="play">▶</span>`:'';
    const cap=capById[x.id]||'';
    return `<div class="card" onclick="this.classList.toggle('open')"><div class="tag">${badge[fmt]||fmt}</div>`
      +`<div class="cover">${cover}${play}</div>`
      +`<div class="meta"><div class="muted" style="font-size:11px">${x.date||''} · tap for detail</div><div>${keyStats(x)}</div>`
      +`<div class="det">${allStats(x)}${cap?`<div class="cap">${cap}</div>`:''}</div></div></div>`;
  }).join('') : '<div class="muted">No posts yet — they\'ll appear here after the next run.</div>';

  // performance by post type (every format with its own stats)
  const byType={};
  ins.forEach(x=>{ if(typeof x.reach==='number'){ const f=x.format||'single'; (byType[f]=byType[f]||[]).push(x); } });
  const tkeys=Object.keys(byType).sort((a,b)=>byType[b].length-byType[a].length);
  const bt=document.getElementById('bytype');
  if(tkeys.length){
    const avg=(a,k)=>a.length?Math.round(a.reduce((s,x)=>s+(x[k]||0),0)/a.length):0;
    const avgEng=a=>{const v=a.filter(x=>typeof x.eng_rate==='number');return v.length?(v.reduce((s,x)=>s+x.eng_rate,0)/v.length*100).toFixed(1)+'%':'—';};
    bt.innerHTML=`<table><tr><th>Type</th><th>Posts</th><th>Avg reach</th><th>Avg shares</th><th>Avg eng%</th></tr>`+
      tkeys.map(f=>`<tr><td><b>${f}</b></td><td>${byType[f].length}</td><td>${avg(byType[f],'reach').toLocaleString()}</td><td>${avg(byType[f],'shares')}</td><td>${avgEng(byType[f])}</td></tr>`).join('')+`</table>`;
  } else { bt.innerHTML='<div class="muted">No insights yet.</div>'; }

  // performance table — ranked by REACH (this account earns reach + shares, not saves)
  const ranked=ins.filter(x=>typeof x.reach==='number')
                  .sort((a,b)=>(b.reach||0)-(a.reach||0)).slice(0,8);
  const perf=document.getElementById('perf');
  if(ranked.length){
    perf.innerHTML=`<table><tr><th>Date</th><th>Post</th><th>Reach</th><th>Shares</th><th>Eng%</th><th>Comments</th><th>Saves</th></tr>`+
      ranked.map(x=>`<tr><td>${x.date||''}</td><td>${x.base||''}</td><td>${(x.reach||0).toLocaleString()}</td><td>${x.shares||0}</td><td>${typeof x.eng_rate==='number'?(x.eng_rate*100).toFixed(1)+'%':'—'}</td><td>${x.comments||0}</td><td>${x.saved||0}</td></tr>`).join('')+`</table>`;
  } else {
    perf.innerHTML='<div class="note">No performance numbers yet — the daily insights job fills these in. Ranked by reach + shares, the signals this account actually earns (saves are ~zero).</div>';
  }
  collapseRecent();
  document.getElementById('updated').textContent='Updated '+new Date().toLocaleString();
}
// Recent posts: browse 800+ a screenful at a time, as a GRID or a swipeable
// CAROUSEL (Esteban's pick, remembered). Both reveal RECENT_PAGE at a time \u2014
// grid via "Show more", carousel via arrows + swipe-to-the-end auto-append.
const RECENT_PAGE=24;
function recentView(){ try{ return localStorage.getItem('recentView')||'carousel'; }catch(e){ return 'carousel'; } }
function setRecentView(m){ try{ localStorage.setItem('recentView',m); }catch(e){}
  window._recentShown=RECENT_PAGE; const el=document.getElementById('recent'); if(el) el.scrollLeft=0; collapseRecent(); }
function recentArrow(dir){
  const el=document.getElementById('recent'); if(!el) return;
  const cards=[...el.children].filter(c=>c.classList&&c.classList.contains('card'));
  // reveal more before paging right, so you can always swipe past the current page
  if(dir>0 && window._recentShown<cards.length){ window._recentShown=Math.min(cards.length,(window._recentShown||RECENT_PAGE)+RECENT_PAGE); collapseRecent(); }
  const c=el.querySelector('.card'); const w=c?c.getBoundingClientRect().width+14:300;
  el.scrollBy({left:dir*w*Math.max(1,Math.floor(el.clientWidth/w)),behavior:'smooth'});
}
function collapseRecent(){
  const el=document.getElementById('recent'); if(!el) return;
  const ctl=document.getElementById('recCtl');
  const legacy=document.getElementById('recentToggle'); if(legacy) legacy.remove();
  const cards=[...el.children].filter(c=>c.classList&&c.classList.contains('card'));
  const mode=recentView();
  el.classList.toggle('carousel',mode==='carousel');
  el.classList.toggle('grid',mode!=='carousel');
  if(!cards.length){ if(ctl) ctl.innerHTML=''; return; }
  if(!window._recentShown) window._recentShown=RECENT_PAGE;
  const shown=Math.min(window._recentShown,cards.length);
  cards.forEach((c,i)=>{ c.style.display=i<shown?'':'none'; });
  if(!ctl) return;
  const seg=`<div class="rec-seg"><button class="${mode!=='carousel'?'on':''}" onclick="setRecentView('grid')">Grid</button>`
    +`<button class="${mode==='carousel'?'on':''}" onclick="setRecentView('carousel')">Carousel</button></div>`;
  // In the carousel you swipe through ALL posts (more auto-load at the end), so
  // "Showing 48 of 812" reads wrong when only a few are on screen — show the total.
  const counter=mode==='carousel'
    ? `<span class="muted" style="font-size:12px">${cards.length.toLocaleString()} posts · swipe to browse</span>`
    : `<span class="muted" style="font-size:12px">Showing ${shown} of ${cards.length.toLocaleString()}</span>`;
  if(mode==='carousel'){
    ctl.innerHTML=seg
      +`<div class="rec-nav"><button class="rec-arrow" onclick="recentArrow(-1)" aria-label="Previous">\u2039</button>`
      +`<button class="rec-arrow" onclick="recentArrow(1)" aria-label="Next">\u203a</button></div>`+counter;
    if(!el._appendBound){ el._appendBound=1; el.addEventListener('scroll',()=>{
      const all=[...el.children].filter(c=>c.classList&&c.classList.contains('card'));
      if(el.scrollLeft+el.clientWidth>=el.scrollWidth-260 && (window._recentShown||0)<all.length){
        window._recentShown=Math.min(all.length,(window._recentShown||RECENT_PAGE)+RECENT_PAGE); collapseRecent();
      }
    },{passive:true}); }
  } else {
    const more=shown<cards.length?`<button class="mc-btn" onclick="window._recentShown=${shown+RECENT_PAGE};collapseRecent()">Show more \u00b7 ${Math.min(RECENT_PAGE,cards.length-shown)} more</button>`:'';
    const less=shown>RECENT_PAGE?`<button class="mc-btn ghost" onclick="window._recentShown=${RECENT_PAGE};collapseRecent();document.getElementById('recent').scrollIntoView({behavior:'smooth',block:'start'})">Show less \u2191</button>`:'';
    ctl.innerHTML=seg+more+less+counter;
  }
}
if(!window._recentResize){ window._recentResize=1; addEventListener('resize',()=>{ clearTimeout(window._rrT); window._rrT=setTimeout(collapseRecent,200); }); }
load();
</script>
