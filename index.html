<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Adventure Costa Rica — Social Dashboard</title>
<link rel="icon" type="image/png" href="https://www.myadventurecostarica.com/logo-mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--sand:#F2EBD9;--bone:#F4EFE3;--ink:#0c100d;--clay:#5C4520;--clay-soft:#b08948;--forest:#169F48;--line:rgba(12,16,13,.12)}
  *{box-sizing:border-box}
  body{margin:0;background:var(--sand);color:var(--ink);font-family:'DM Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1100px;margin:0 auto;padding:40px 24px 80px}
  h1{font-family:'Fraunces',serif;font-weight:500;font-size:34px;margin:0}
  .eyebrow{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--clay);font-weight:600}
  .top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;border-bottom:1px solid var(--line);padding-bottom:20px;margin-bottom:28px;flex-wrap:wrap}
  button{font-family:inherit;font-size:13px;border:1px solid var(--line);background:var(--bone);color:var(--ink);padding:9px 16px;border-radius:999px;cursor:pointer}
  button:hover{background:#fff}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px;margin-bottom:36px}
  .stat{background:var(--bone);border:1px solid var(--line);border-radius:14px;padding:20px}
  .stat .n{font-family:'Fraunces',serif;font-size:38px;line-height:1}
  .stat .l{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--clay);margin-top:8px;font-weight:600}
  h2{font-family:'Fraunces',serif;font-weight:500;font-size:22px;margin:36px 0 16px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px;align-items:start}
  .card{background:var(--bone);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .card img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:#ddd}
  .card .meta{padding:10px 12px;font-size:12px;color:var(--clay)}
  .card .meta b{color:var(--ink);font-weight:600}
  .card{position:relative;cursor:pointer}
  .tag{position:absolute;top:8px;left:8px;background:rgba(12,16,13,.8);color:#fff;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:6px;z-index:1}
  .badge{width:100%;aspect-ratio:1;display:flex;align-items:center;justify-content:center;background:var(--sand);color:var(--clay);font-family:'Fraunces',serif;font-size:22px}
  .det{display:none;margin-top:10px}
  .card.open .det{display:block}
  .detail{width:100%;border-collapse:collapse;font-size:12px}
  .detail td{padding:3px 0;border-bottom:1px solid var(--line)}
  .detail td:last-child{text-align:right;font-weight:600}
  .cap{margin-top:10px;font-size:12px;color:var(--clay);white-space:pre-wrap;max-height:140px;overflow:auto}
  table{width:100%;border-collapse:collapse;background:var(--bone);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  th,td{text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);font-size:14px}
  th{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--clay)}
  tr:last-child td{border-bottom:none}
  .muted{color:var(--clay);font-size:14px}
  .note{background:var(--bone);border:1px dashed var(--clay-soft);border-radius:12px;padding:16px;color:var(--clay);font-size:14px;margin-top:12px}
  a{color:var(--forest)}
  .rv-banner{display:flex;align-items:center;gap:14px;background:var(--bone);border:1px solid var(--clay-soft);border-radius:12px;padding:12px 18px;margin-bottom:28px}
  .rv-banner a{margin-left:auto;font-size:13px;font-weight:600;white-space:nowrap}
  .new-pill{background:var(--clay);color:#fff;font-size:11px;font-weight:700;letter-spacing:.08em;padding:2px 9px;border-radius:999px;text-transform:uppercase}
  .review{background:var(--bone);border:1px solid var(--clay-soft);border-left:4px solid var(--clay);border-radius:14px;padding:20px 24px;margin-bottom:32px}
  .rv-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:6px}
  .rv-body h2,.rv-body h3,.rv-body h4{font-family:'Fraunces',serif;font-weight:500;margin:16px 0 6px;font-size:17px}
  .rv-body p{margin:8px 0;line-height:1.55}
  .rv-body ol,.rv-body ul{margin:8px 0;padding-left:22px}
  .rv-body li{margin:5px 0;line-height:1.5}
  .rv-body code{background:rgba(12,16,13,.06);padding:1px 6px;border-radius:5px;font-size:13px}
  .inbox-card{background:var(--bone);border:1px solid var(--clay-soft);border-left:4px solid var(--forest);border-radius:12px;padding:14px 18px;margin-bottom:14px}
  .ic-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
  .chip{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:rgba(12,16,13,.07);color:var(--clay)}
  .chip.dm{background:var(--clay);color:#fff}
  .ic-msg{margin:4px 0 10px;line-height:1.5}
  .ic-draft{background:rgba(176,137,72,.10);border-radius:9px;padding:10px 12px;line-height:1.5;position:relative}
  .ic-copy{position:absolute;top:8px;right:8px;font-size:12px;padding:3px 10px;border:1px solid var(--clay-soft);background:#fff;border-radius:7px;cursor:pointer}
  .mc-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--bone);border:1px solid var(--clay-soft);border-radius:12px;padding:12px 16px;margin-bottom:24px}
  .mc-status{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:2px 9px;border-radius:999px}
  .mc-status.on{background:var(--forest,#169F48);color:#fff}
  .mc-status.off{background:rgba(12,16,13,.10);color:var(--clay)}
  .mc-btn{font-size:13px;font-weight:600;padding:6px 14px;border:1px solid var(--clay-soft);background:#fff;color:var(--ink);border-radius:8px;cursor:pointer}
  .mc-btn:hover{background:var(--sand,#f2ebd9)}
  .mc-btn:disabled{opacity:.55;cursor:default}
  .mc-btn.send{background:var(--forest,#169F48);color:#fff;border-color:var(--forest,#169F48)}
  .mc-btn.ghost{border-style:dashed}
  .mc-runs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 18px;margin-top:10px}
  .mc-run{font-size:12.5px;line-height:1.5}
  .mc-run a{color:inherit;text-decoration:none;border-bottom:1px dotted var(--clay-soft)}
  .run-ok{color:var(--forest,#169F48);font-weight:700}
  .run-bad{color:#c0392b;font-weight:700}
  .run-go{color:#b8860b;font-weight:700}
  .mc-gear{margin-left:auto;font-size:16px;background:none;border:none;cursor:pointer;color:var(--clay)}
  .mc-in{width:100%;max-width:420px;display:block;margin:6px 0;padding:8px 10px;border:1px solid var(--clay-soft);border-radius:8px;font-size:14px}
  .ic-edit{width:100%;box-sizing:border-box;margin:8px 0 4px;padding:9px 11px;border:1px solid var(--clay-soft);border-radius:9px;font:inherit;font-size:14px;line-height:1.5;background:#fff;resize:vertical}
  .ic-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .ic-post{display:flex;gap:11px;align-items:center;margin-bottom:11px;padding-bottom:11px;border-bottom:1px solid rgba(176,137,72,.28)}
  .ic-thumb{width:48px;height:48px;border-radius:8px;object-fit:cover;flex:none;display:block}
  .ic-post .badge{width:48px;height:48px;display:flex;align-items:center;justify-content:center;border-radius:8px;background:rgba(12,16,13,.08);color:var(--clay);font-size:11px;font-weight:700;flex:none}
  .ic-pcap{font-size:13px;line-height:1.4;max-height:2.9em;overflow:hidden;margin-top:2px}
  .modal-ov{position:fixed;inset:0;background:rgba(12,16,13,.45);display:flex;align-items:center;justify-content:center;z-index:9999}
  .modal{background:var(--bone);border:1px solid var(--clay-soft);border-radius:14px;padding:22px 24px;max-width:380px;box-shadow:0 14px 44px rgba(0,0,0,.28)}
  .modal p{margin:0 0 16px;line-height:1.5}
  .modal-btns{display:flex;gap:10px;justify-content:flex-end}
  #toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(18px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:all .25s ease;z-index:10000;max-width:80%}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .mc-toggle{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--clay);cursor:pointer;user-select:none}
  .mc-toggle input{width:16px;height:16px;accent-color:var(--forest,#169F48);cursor:pointer}
  .pending-card{background:var(--bone);border:1px solid var(--clay-soft);border-left:4px solid var(--clay);border-radius:14px;padding:18px 20px;margin-bottom:26px}
  .pp-imgs{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0 12px}
  .pp-thumb{width:128px;height:128px;object-fit:cover;border-radius:10px;flex:none;border:1px solid var(--clay-soft)}
  .pp-video{width:200px;max-height:356px;border-radius:10px;border:1px solid var(--clay-soft);background:#000;flex:none}
  .pub-thumb{width:52px;height:52px;object-fit:cover;border-radius:8px;border:1px solid var(--clay-soft);flex:none;display:block}
  .pp-edit{width:100%;box-sizing:border-box;margin:6px 0 10px;padding:11px 13px;border:1px solid var(--clay-soft);border-radius:10px;font:inherit;font-size:14px;line-height:1.55;background:#fff;resize:vertical;white-space:pre-wrap}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div style="display:flex;align-items:center;gap:14px">
      <img src="https://www.myadventurecostarica.com/logo-mark.png" alt="My Adventure Costa Rica" style="height:44px;width:auto" onerror="this.style.display='none'">
      <div>
        <div class="eyebrow">My Adventure Costa Rica</div>
        <h1>Social Dashboard</h1>
      </div>
    </div>
    <button onclick="load()">↻ Refresh</button>
  </div>
  <div id="controls"></div>
  <div id="published"></div>
  <div id="pending"></div>
  <div id="pendingReel"></div>
  <div id="review-top"></div>
  <div id="inbox"></div>
  <div class="stats" id="stats"></div>
  <h2>Recent posts</h2>
  <div class="grid" id="recent"><div class="muted">Loading…</div></div>
  <h2>By post type <span class="muted" style="font-size:13px">— how each format performs</span></h2>
  <div id="bytype"></div>
  <h2>Top performers <span class="muted" style="font-size:13px">— by reach + shares</span></h2>
  <div id="perf"></div>
  <div id="review-full" style="scroll-margin-top:16px;margin-top:44px"></div>
  <p class="muted" id="updated" style="margin-top:40px"></p>
</div>
<script>
const REPO='MyAdventureCostaRica/social-autoposter', BRANCH='main';
const RAW=`https://raw.githubusercontent.com/${REPO}/${BRANCH}`;
const API=`https://api.github.com/repos/${REPO}/contents`;
async function j(u){try{const r=await fetch(u,{cache:'no-store'});if(!r.ok)return null;return await r.json();}catch(e){return null;}}
function imgExt(n){return /\.(jpe?g|png)$/i.test(n);}
function photoExt(n){return /\.(jpe?g|png|heic|heif)$/i.test(n);}
function imgFail(el,label){el.outerHTML='<div class="badge">'+label+'</div>';}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function md(t){
  const lines=esc(t).split('\n'); let html='', list=null;
  const inline=s=>s.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`(.+?)`/g,'<code>$1</code>');
  const close=()=>{ if(list){html+=`</${list}>`; list=null;} };
  for(const ln of lines){
    if(/^#{1,6}\s/.test(ln)){ close(); const lvl=Math.min(ln.match(/^#+/)[0].length+1,4); html+=`<h${lvl}>${inline(ln.replace(/^#+\s/,''))}</h${lvl}>`; continue; }
    let m=ln.match(/^\s*\d+\.\s+(.*)/);
    if(m){ if(list!=='ol'){close();html+='<ol>';list='ol';} html+=`<li>${inline(m[1])}</li>`; continue; }
    m=ln.match(/^\s*[-*]\s+(.*)/);
    if(m){ if(list!=='ul'){close();html+='<ul>';list='ul';} html+=`<li>${inline(m[1])}</li>`; continue; }
    if(ln.trim()===''){ close(); continue; }
    close(); html+=`<p>${inline(ln)}</p>`;
  }
  close(); return html;
}
function markSeen(when){ try{localStorage.setItem('lastSeenReview',when);}catch(e){}
  const p=document.querySelector('.new-pill'); if(p)p.remove();
  document.title=document.title.replace(/^●\s*/,''); }
function renderReview(rv){
  const top=document.getElementById('review-top'), full=document.getElementById('review-full');
  if(!top||!full) return;
  if(!rv||!rv.markdown){ top.innerHTML=''; full.innerHTML=''; return; }
  const when=(rv.stats&&rv.stats.generated)||'';
  let seen=null; try{seen=localStorage.getItem('lastSeenReview');}catch(e){}
  const isNew = when && when!==seen;
  top.innerHTML=`<div class="rv-banner"><span class="eyebrow">Monthly review · ${when}</span>`
    +(isNew?`<span class="new-pill">New</span>`:``)
    +`<a href="#review-full" onclick="markSeen('${when}')">Read proposals ↓</a></div>`;
  full.innerHTML=`<h2>Monthly review <span class="muted" style="font-size:13px">— ${when} · reply to Claude to apply</span></h2>`
    +`<div class="review"><div class="rv-body">${md(rv.markdown)}</div></div>`;
  if(isNew && !/^●/.test(document.title)) document.title='● '+document.title;
}
function copyText(btn,txt){ navigator.clipboard.writeText(txt).then(()=>{const o=btn.textContent;btn.textContent='Copied';setTimeout(()=>btn.textContent=o,1400);}); }
function escA(s){ return esc(String(s==null?'':s)).replace(/"/g,'&quot;'); }

// --- Mission control: talk to the Vercel backend (api/control.js) -------------
function cfg(k){ try{return localStorage.getItem(k)||'';}catch(e){return '';} }
function setCfg(k,v){ try{localStorage.setItem(k,v);}catch(e){} }
function apiBase(){ return cfg('ctrlUrl').replace(/\/+$/,''); }
function connected(){ return !!(apiBase() && cfg('ctrlKey')); }
async function ctrl(action,payload){
  if(!connected()){ toggleConnect(true); return {ok:false,error:'not connected'}; }
  try{
    const r=await fetch(apiBase()+'/api/control',{method:'POST',
      headers:{'Content-Type':'application/json','x-dash-key':cfg('ctrlKey')},
      body:JSON.stringify(Object.assign({action},payload))});
    return await r.json();
  }catch(e){ return {ok:false,error:String(e)}; }
}
function toggleConnect(force){
  const p=document.getElementById('connectPanel'); if(!p) return;
  p.style.display=(force===true||p.style.display==='none')?'block':'none';
}
function saveConnect(){
  setCfg('ctrlUrl',(document.getElementById('cUrl').value||'').trim());
  setCfg('ctrlKey',(document.getElementById('cKey').value||'').trim());
  toggleConnect(false); renderControls();
}
async function testConnect(){
  const s=document.getElementById('cTest'); s.textContent='Testing…';
  setCfg('ctrlUrl',(document.getElementById('cUrl').value||'').trim());
  setCfg('ctrlKey',(document.getElementById('cKey').value||'').trim());
  const r=await ctrl('ping',{}); s.textContent=(r&&r.ok)?'Connected ✓':('Failed: '+((r&&r.error)||'?'));
}
function uiToast(msg){
  let t=document.getElementById('toast');
  if(!t){t=document.createElement('div');t.id='toast';document.body.appendChild(t);}
  t.textContent=msg; t.className='show';
  clearTimeout(t._h); t._h=setTimeout(()=>{t.className='';},2600);
}
function uiConfirm(msg,okLabel){
  return new Promise(res=>{
    const ov=document.createElement('div'); ov.className='modal-ov';
    ov.innerHTML=`<div class="modal"><p>${esc(msg)}</p><div class="modal-btns">`
      +`<button class="mc-btn ghost" data-no>Cancel</button>`
      +`<button class="mc-btn send" data-yes>${esc(okLabel||'Confirm')}</button></div></div>`;
    document.body.appendChild(ov);
    const done=v=>{ov.remove();res(v);};
    ov.querySelector('[data-yes]').onclick=()=>done(true);
    ov.querySelector('[data-no]').onclick=()=>done(false);
    ov.addEventListener('click',e=>{if(e.target===ov)done(false);});
  });
}
function trigger(workflow,label,btn,stages){
  uiConfirm(stages?('Prepare '+label+' for your review?'):('Run '+label+' now?'),stages?'Prepare it':'Run it').then(ok=>{
    if(!ok) return;
    const o=btn.textContent; btn.disabled=true; btn.textContent=stages?'Preparing…':'Starting…';
    ctrl('dispatch',{workflow}).then(r=>{
      const good=r&&r.ok;
      btn.textContent=good?(stages?'Preparing ✓':'Started ✓'):'Failed';
      uiToast(good?(stages?'Preparing — it will appear above to approve in ~1 min'
                          :(label.replace(/^(the|a) /,'')+' started'))
                  :('Could not start: '+((r&&r.error)||'error')));
      if(good) setTimeout(loadRunStatus,4000);
      if(good && stages) setTimeout(()=>renderLive(true),60000);
      setTimeout(()=>{btn.textContent=o; btn.disabled=false;},2800);
    });
  });
}
const RUN_WF={
  insights:{file:'insights.yml',name:'Refresh insights'},
  post:{file:'daily-post.yml',name:'Prepare a post'},
  reel:{file:'reel-post.yml',name:'Prepare a reel'},
  responder:{file:'respond.yml',name:'Check messages'},
  review:{file:'review.yml',name:'Monthly review'},
  publish:{file:'publish.yml',name:'Publish approved'}
};
function fmtRel(iso){
  if(!iso) return '\u2014';
  let s=(Date.now()-new Date(iso).getTime())/1000; if(s<0)s=0;
  if(s<60) return 'just now';
  const m=s/60; if(m<60) return Math.floor(m)+'m ago';
  const h=m/60; if(h<24) return Math.floor(h)+'h ago';
  const d=h/24; if(d<7) return Math.floor(d)+'d ago';
  return new Date(iso).toLocaleDateString();
}
let _runTimer=null,_runTick=null,_runState=[];
async function fetchRuns(){
  if(connected()){
    try{ const r=await ctrl('runs'); if(r&&r.ok&&r.runs) return r.runs; }catch(e){}
  }
  const keys=Object.keys(RUN_WF);
  const res=await Promise.all(keys.map(k=>
    j(`https://api.github.com/repos/${REPO}/actions/workflows/${RUN_WF[k].file}/runs?per_page=20`)));
  const out={}; keys.forEach((k,i)=>{ out[k]=(res[i]&&res[i].workflow_runs)||[]; });
  return out;
}
function renderRuns(){
  const box=document.getElementById('mcRuns'); if(!box) return;
  let html='';
  for(const it of _runState){
    if(it.empty){ html+=`<div class="mc-run"><a href="${it.link}" target="_blank" rel="noopener"><b>${it.name}</b></a> <span class="muted">never run</span></div>`; continue; }
    let state;
    if(it.running){
      let prog='';
      if(it.avg){ const pct=Math.min(99,Math.max(1,Math.round((Date.now()-it.start)/it.avg*100))); prog=` ~${pct}% complete`; }
      state=`<span class="run-go">●</span> running…${prog} · started ${fmtRel(new Date(it.start).toISOString())}`;
    } else {
      const ic=it.ok?'<span class="run-ok">✓</span>':'<span class="run-bad">✗</span>';
      state=`${ic} triggered ${fmtRel(new Date(it.start).toISOString())} · last success ${it.succWhen?fmtRel(it.succWhen):'none'}`;
    }
    html+=`<div class="mc-run"><a href="${it.link}" target="_blank" rel="noopener"><b>${it.name}</b></a> <span class="muted">${state}</span></div>`;
  }
  box.innerHTML=html;
}
async function loadRunStatus(){
  const box=document.getElementById('mcRuns'); if(!box) return;
  let data={}; try{ data=await fetchRuns(); }catch(e){ data={}; }
  let anyRunning=false;
  _runState=Object.keys(RUN_WF).map(k=>{
    const w=RUN_WF[k]; const runs=data[k]||[];
    const link=`https://github.com/${REPO}/actions/workflows/${w.file}`;
    if(!runs.length) return {name:w.name,link,empty:true};
    const last=runs[0];
    const start=new Date(last.run_started_at||last.created_at).getTime();
    const running=!!(last.status&&last.status!=='completed'); if(running) anyRunning=true;
    const succ=runs.find(r=>r.conclusion==='success');
    const durs=runs.filter(r=>r.conclusion==='success'&&r.run_started_at&&r.updated_at)
      .slice(0,5).map(r=>new Date(r.updated_at)-new Date(r.run_started_at)).filter(d=>d>0);
    const avg=durs.length?durs.reduce((a,b)=>a+b,0)/durs.length:0;
    return {name:w.name,link,running,start,avg,ok:last.conclusion==='success',succWhen:succ?succ.updated_at:null};
  });
  renderRuns();
  if(_runTimer) clearTimeout(_runTimer);
  const conn=connected();
  const ms=anyRunning?(conn?10000:30000):(conn?30000:300000);
  _runTimer=setTimeout(loadRunStatus, ms);
  if(anyRunning && !_runTick) _runTick=setInterval(renderRuns,1000);
  if(!anyRunning && _runTick){ clearInterval(_runTick); _runTick=null; }
}
function renderControls(){
  const el=document.getElementById('controls'); if(!el) return;
  const on=connected();
  el.innerHTML=`<div class="mc-bar"><span class="eyebrow">Mission control</span>`
    +`<span class="mc-status ${on?'on':'off'}">${on?'connected':'not connected'}</span>`
    +`<button class="mc-btn" onclick="trigger('insights','insights refresh',this)">Refresh insights</button>`
    +`<button class="mc-btn" onclick="trigger('post','a post',this,true)">Prepare a post</button>`
    +`<button class="mc-btn" onclick="trigger('reel','a reel',this,true)">Prepare a reel</button>`
    +`<button class="mc-btn" onclick="trigger('responder','the message check',this)">Check messages</button>`
    +`<button class="mc-btn" onclick="trigger('review','the monthly review',this)">Run review</button>`
    +`<label class="mc-toggle" title="ON = posts publish automatically. OFF = posts wait for your approval on the dashboard."><input type="checkbox" id="autoApprove" onchange="setAutoApprove(this.checked)"> Auto-approve</label>`
    +`<button class="mc-gear" onclick="toggleConnect()" title="Connect">⚙</button></div>`
    +`<div class="mc-runs" id="mcRuns"></div>`
    +`<div id="connectPanel" style="display:none">`
    +`<p class="muted" style="font-size:13px;margin:10px 0 6px">Paste your Vercel URL (e.g. https://your-project.vercel.app) and the passphrase you set as DASH_KEY. Stored only in this browser.</p>`
    +`<input class="mc-in" id="cUrl" placeholder="https://your-project.vercel.app" value="${escA(cfg('ctrlUrl'))}">`
    +`<input class="mc-in" id="cKey" type="password" placeholder="passphrase (DASH_KEY)" value="${escA(cfg('ctrlKey'))}">`
    +`<div style="margin-top:8px"><button class="mc-btn" onclick="saveConnect()">Save</button>`
    +`<button class="mc-btn" onclick="testConnect()">Test</button>`
    +`<span id="cTest" class="muted" style="font-size:13px;margin-left:10px"></span></div></div>`;
  loadRunStatus();
  refreshAutoApprove();
}
function refreshAutoApprove(){
  if(!connected()) return;
  ctrl('get_settings',{}).then(r=>{
    const t=document.getElementById('autoApprove');
    if(t&&r&&r.ok&&r.settings) t.checked=!!r.settings.auto_approve;
  });
}
function setAutoApprove(on){
  ctrl('set_setting',{key:'auto_approve',value:!!on}).then(r=>{
    uiToast(on?'Auto-approve ON — posts publish automatically'
              :'Human review ON — posts wait for your approval');
  });
}
// Live poll: one call returns what's awaiting approval + what just went live.
async function renderLive(announce){
  const pe=document.getElementById('pending'), pre=document.getElementById('pendingReel'), pubEl=document.getElementById('published');
  if(!connected()){ if(pe)pe.innerHTML=''; if(pre)pre.innerHTML=''; if(pubEl)pubEl.innerHTML=''; return; }
  let s=null; try{ const r=await ctrl('status',{}); s=r&&r.ok?r:null; }catch(e){}
  if(!s) return;
  renderPendingCard(s.pending, announce);
  renderReelCard(s.pendingReel, announce);
  renderPublishedBanner(s.published, announce);
}
function renderReelCard(p, announce){
  const el=document.getElementById('pendingReel'); if(!el) return;
  if(!p){ el.innerHTML=''; el.dataset.ts=''; return; }
  if(el.dataset.ts===String(p.ts||'') && el.querySelector('.pending-card')) return;
  el.dataset.ts=String(p.ts||'');
  const media=p.video_url
    ?`<video class="pp-video" src="${escA(p.video_url)}" poster="${escA(p.thumb_url||'')}" controls preload="metadata"></video>`
    :(p.thumb_url?`<img class="pp-thumb" src="${escA(p.thumb_url)}" onerror="imgFail(this,'REEL')">`:'');
  el.innerHTML=`<div class="pending-card"><div class="ic-head">`
    +`<span class="eyebrow">Reel awaiting your approval</span>`
    +`<span class="chip">${esc((p.pillar||'').toString())}</span>`
    +`<span class="chip">${esc((p.duration||'')+'s')}</span></div>`
    +`<div class="pp-imgs">${media}</div>`
    +`<span class="muted" style="font-size:12px">Caption — edit before approving</span>`
    +`<textarea class="pp-edit" rows="6">${esc(p.caption||'')}</textarea>`
    +`<div class="ic-actions">`
    +`<button class="mc-btn send" onclick="approveReelBtn(this)">Approve &amp; post</button>`
    +`<button class="mc-btn" onclick="rejectReelBtn(this)">Reject &amp; pick another</button>`
    +`<span class="ic-stat muted" style="font-size:13px"></span></div></div>`;
  if(announce){ uiToast('🎬 A reel is ready to approve'); if(!/^●/.test(document.title)) document.title='● '+document.title; }
}
function approveReelBtn(btn){
  const card=btn.closest('.pending-card'); const cap=card.querySelector('.pp-edit').value;
  const stat=card.querySelector('.ic-stat'); stat.textContent='Publishing…';
  card.querySelectorAll('button,textarea').forEach(b=>b.disabled=true);
  ctrl('approve_reel',{caption:cap}).then(r=>{
    if(r&&r.ok){ stat.textContent='Approved — posting ✓'; uiToast('Reel approved — publishing now'); setTimeout(()=>card.remove(),1000); }
    else { stat.textContent='Failed: '+((r&&r.error)||'error'); card.querySelectorAll('button,textarea').forEach(b=>b.disabled=false); }
  });
}
function rejectReelBtn(btn){
  uiConfirm("Reject this clip and stage another? It won't be picked again.",'Reject').then(ok=>{
    if(!ok) return;
    const card=btn.closest('.pending-card'); const stat=card.querySelector('.ic-stat');
    stat.textContent='Rejecting…'; card.querySelectorAll('button,textarea').forEach(b=>b.disabled=true);
    ctrl('reject_reel',{}).then(r=>{
      if(r&&r.ok){ stat.textContent='Rejected — staging another ✓'; uiToast('Reel rejected — staging another'); setTimeout(()=>card.remove(),1400); }
      else { stat.textContent='Failed: '+((r&&r.error)||'error'); card.querySelectorAll('button,textarea').forEach(b=>b.disabled=false); }
    });
  });
}
function renderPendingCard(p, announce){
  const el=document.getElementById('pending'); if(!el) return;
  if(!p){ el.innerHTML=''; el.dataset.ts=''; return; }
  // don't wipe an in-progress edit if it's the same pending post
  if(el.dataset.ts===String(p.ts||'') && el.querySelector('.pending-card')) return;
  el.dataset.ts=String(p.ts||'');
  const imgs=(p.image_urls&&p.image_urls.length?p.image_urls:[p.image_url]).filter(Boolean);
  let thumbs=imgs.map(u=>`<img class="pp-thumb" src="${escA(u)}" onerror="imgFail(this,'IMG')">`).join('');
  if(p.story_url) thumbs+=`<img class="pp-thumb" src="${escA(p.story_url)}" onerror="imgFail(this,'STORY')">`;
  el.innerHTML=`<div class="pending-card"><div class="ic-head">`
    +`<span class="eyebrow">Post awaiting your approval</span>`
    +`<span class="chip">${esc((p.pillar||'').toString())}</span>`
    +`<span class="chip">${esc(p.format||'single')}</span></div>`
    +`<div class="pp-imgs">${thumbs}</div>`
    +`<span class="muted" style="font-size:12px">Caption — edit before approving; your edits teach the voice</span>`
    +`<textarea class="pp-edit" rows="6">${esc(p.caption||'')}</textarea>`
    +`<div class="ic-actions">`
    +`<button class="mc-btn send" onclick="approvePending(this)">Approve &amp; post</button>`
    +`<button class="mc-btn" onclick="rejectPending(this)">Reject &amp; pick another</button>`
    +`<span class="ic-stat muted" style="font-size:13px"></span></div></div>`;
  if(announce){ uiToast('📸 A post is ready to approve'); if(!/^●/.test(document.title)) document.title='● '+document.title; }
}
function renderPublishedBanner(pub, announce){
  const el=document.getElementById('published'); if(!el) return;
  if(!pub||!pub.ts){ el.innerHTML=''; el.dataset.ts=''; return; }
  // Re-render the banner only when the published post actually changes (no flicker).
  if(el.dataset.ts!==String(pub.ts)){
    el.dataset.ts=String(pub.ts);
    const link=pub.permalink||'https://www.instagram.com/myadventurecostarica/';
    el.innerHTML=`<div class="rv-banner">`
      +(pub.image?`<a href="${escA(link)}" target="_blank" rel="noopener"><img class="pub-thumb" src="${escA(pub.image)}" onerror="imgFail(this,'LIVE')"></a>`:``)
      +`<span class="eyebrow">Just posted${pub.pillar?(' · '+esc(pub.pillar)):''}</span>`
      +`<span class="new-pill">Live</span>`
      +`<a href="${escA(link)}" target="_blank" rel="noopener">View on Instagram ↗</a></div>`;
  }
  // Toast EXACTLY ONCE per published post — mark it announced immediately so the
  // 30s poll never repeats it (the old code only cleared on link-click).
  let announced=null; try{announced=localStorage.getItem('announcedPublished');}catch(e){}
  if(announce && String(pub.ts)!==announced){
    try{localStorage.setItem('announcedPublished',String(pub.ts));}catch(e){}
    uiToast('✅ Your post is live on Instagram');
  }
}
function approvePending(btn){
  const card=btn.closest('.pending-card');
  const cap=card.querySelector('.pp-edit').value;
  const stat=card.querySelector('.ic-stat'); stat.textContent='Publishing…';
  card.querySelectorAll('button,textarea').forEach(b=>b.disabled=true);
  ctrl('approve_post',{caption:cap}).then(r=>{
    if(r&&r.ok){ stat.textContent='Approved — posting ✓'; uiToast('Approved — publishing now');
      setTimeout(()=>{card.remove();},1000);
    } else { stat.textContent='Failed: '+((r&&r.error)||'error'); uiToast('Failed: '+((r&&r.error)||'error'));
      card.querySelectorAll('button,textarea').forEach(b=>b.disabled=false); }
  });
}
function rejectPending(btn){
  uiConfirm("Reject this photo and stage another? It won't be picked again.",'Reject').then(ok=>{
    if(!ok) return;
    const card=btn.closest('.pending-card'); const stat=card.querySelector('.ic-stat');
    stat.textContent='Rejecting…'; card.querySelectorAll('button,textarea').forEach(b=>b.disabled=true);
    ctrl('reject_post',{}).then(r=>{
      if(r&&r.ok){ stat.textContent='Rejected — staging another ✓'; uiToast('Rejected — staging another');
        setTimeout(()=>{card.remove();},1400);
      } else { stat.textContent='Failed: '+((r&&r.error)||'error');
        card.querySelectorAll('button,textarea').forEach(b=>b.disabled=false); }
    });
  });
}

function inboxAction(btn,act){
  const card=btn.closest('.inbox-card');
  const id=card.dataset.id, type=card.dataset.type, recipient=card.dataset.recipient||'';
  const ta=card.querySelector('.ic-edit'); const text=ta?ta.value.trim():'';
  if(act==='reply' && !text){ uiToast('Write a reply first.'); if(ta)ta.focus(); return; }
  const go=()=>{
    const stat=card.querySelector('.ic-stat'); stat.textContent=act==='reply'?'Sending…':'Dismissing…';
    card.querySelectorAll('button').forEach(b=>b.disabled=true);
    ctrl(act, act==='reply'?{id,type,text,recipient}:{id}).then(r=>{
      if(r&&r.ok){
        card.style.opacity=.45; stat.textContent=act==='reply'?'Sent ✓':'Dismissed ✓';
        card.querySelectorAll('button,textarea').forEach(b=>b.disabled=true);
        uiToast(act==='reply'?'Reply sent on Instagram':'Dismissed');
        setTimeout(()=>{card.remove();
          if(!document.querySelectorAll('.inbox-card').length){
            const el=document.getElementById('inbox'); if(el) el.innerHTML='<p class="muted" style="margin-top:8px">Inbox clear — nothing waiting.</p>';}
        },900);
      }else{ stat.textContent='Error: '+((r&&r.error)||'failed'); uiToast('Failed: '+((r&&r.error)||'error')); card.querySelectorAll('button').forEach(b=>b.disabled=false); }
    });
  };
  if(act==='reject') uiConfirm('Reject and dismiss this one? Nothing will be sent.','Reject').then(ok=>{ if(ok) go(); });
  else go();
}
function renderInbox(items,resolved,postsById){
  const el=document.getElementById('inbox'); if(!el) return;
  resolved=resolved||{}; postsById=postsById||{};
  const list=Array.isArray(items)?items.filter(x=>x&&x.status==='pending'&&!resolved[x.id]):[];
  if(!list.length){ el.innerHTML=''; return; }
  let seen=0; try{seen=+localStorage.getItem('lastSeenInbox')||0;}catch(e){}
  const isNew=list.length>seen;
  let html=`<div class="rv-banner"><span class="eyebrow">Inbox · ${list.length} waiting</span>`
    +(isNew?`<span class="new-pill">New</span>`:``)
    +`<a href="#inbox-full" onclick="try{localStorage.setItem('lastSeenInbox',${list.length})}catch(e){};">See drafts ↓</a></div>`;
  html+=`<div id="inbox-full" style="scroll-margin-top:16px">`;
  for(const p of list){
    const link=p.type==='comment'?(p.permalink||''):'https://www.instagram.com/direct/inbox/';
    const pj=(p.type!=='dm'&&p.media_id&&postsById[p.media_id])?postsById[p.media_id]:null;
    let postRow;
    if(p.type==='dm'){
      postRow=`<div class="ic-post"><div class="badge">DM</div><div><span class="muted" style="font-size:12px">Direct message</span></div></div>`;
    } else if(pj){
      const cap=esc((pj.caption||'').replace(/\s+/g,' ').trim().slice(0,90));
      const cover=pj.thumb?`<a href="${escA(p.permalink||link)}" target="_blank" rel="noopener"><img class="ic-thumb" src="${escA(pj.thumb)}" onerror="imgFail(this,'POST')"></a>`:`<div class="badge">POST</div>`;
      postRow=`<div class="ic-post">${cover}<div><span class="muted" style="font-size:12px">Replying to your post${pj.date?(' · '+esc(pj.date)):''}</span><div class="ic-pcap">${cap||'(no caption)'}</div></div></div>`;
    } else {
      postRow=`<div class="ic-post"><div class="badge">POST</div><div><span class="muted" style="font-size:12px">Replying to a post — <a href="${escA(p.permalink||link)}" target="_blank" rel="noopener">open on Instagram ↗</a></span></div></div>`;
    }
    html+=`<div class="inbox-card" data-id="${escA(p.id)}" data-type="${escA(p.type||'comment')}" data-recipient="${escA(p.recipient||'')}">`+postRow+`<div class="ic-head">`
      +`<b>@${esc(p.user||'someone')}</b> <span class="chip">${esc(p.intent||'')}</span>`
      +`<span class="chip ${p.type}">${p.type==='dm'?'DM':'comment'}</span>`
      +(link?`<a href="${escA(link)}" target="_blank" rel="noopener" style="margin-left:auto;font-size:13px">On Instagram ↗</a>`:``)
      +`</div><p class="ic-msg">${esc(p.text||'')}</p>`
      +`<textarea class="ic-edit" rows="2" placeholder="Write or edit the reply…">${esc(p.reply||'')}</textarea>`
      +`<div class="ic-actions">`
      +`<button class="mc-btn send" onclick="inboxAction(this,'reply')">Approve &amp; send</button>`
      +`<button class="mc-btn" onclick="inboxAction(this,'reject')">Reject</button>`
      +`<button class="mc-btn ghost" onclick="copyText(this,this.closest('.inbox-card').querySelector('.ic-edit').value)">Copy</button>`
      +`<span class="ic-stat muted" style="font-size:13px"></span></div></div>`;
  }
  html+=`</div>`;
  el.innerHTML=html;
  if(isNew && !/^●/.test(document.title)) document.title='● '+document.title;
}

async function load(){
  const [src,posted,rendered,insights,posts,review]=await Promise.all([
    j(`${API}/source-photos`), j(`${API}/posted`), j(`${API}/rendered`),
    j(`${RAW}/metrics/insights.json`), j(`${RAW}/metrics/posts.json`),
    j(`${RAW}/metrics/review-latest.json`)
  ]);
  renderControls();
  renderLive(false);
  if(!window._livePoll){ window._livePoll=setInterval(()=>{ if(connected()) renderLive(true); }, 30000); }
  let reviewObj=review;   // prefer the instant backend copy over the CDN-cached raw file
  if(connected()){ try{ const rr=await ctrl('review',{}); if(rr&&rr.ok&&rr.review) reviewObj=rr.review; }catch(e){} }
  renderReview(reviewObj);
  const postsById={}; if(Array.isArray(posts)) for(const pp of posts){ if(pp&&pp.id) postsById[pp.id]=pp; }
  // Inbox is PRIVATE: it never touches the public repo. Load it through the
  // authenticated backend (api/control "inbox"). Requires you to be connected.
  const inboxEl=document.getElementById('inbox');
  if(connected()){
    const r=await ctrl('inbox',{});
    if(r&&r.ok){ renderInbox(r.inbox||[], r.resolutions||{}, postsById); }
    else if(inboxEl){ inboxEl.innerHTML='<p class="muted" style="margin-top:8px">Could not load the inbox — check your connection details.</p>'; }
  } else if(inboxEl){
    inboxEl.innerHTML='<p class="muted" style="margin-top:8px">Connect mission control (above) to view and reply to your inbox.</p>';
  }
  const queue=Array.isArray(src)?src.filter(f=>photoExt(f.name)).length:0;
  const postedCount=Array.isArray(posted)?posted.filter(f=>imgExt(f.name)).length:0;
  const ins=Array.isArray(insights)?insights:[];
  const withReach=ins.filter(x=>typeof x.reach==='number');
  const avgReach=withReach.length?Math.round(withReach.reduce((a,b)=>a+b.reach,0)/withReach.length):null;
  const totalShares=ins.reduce((a,b)=>a+(b.shares||0),0);

  document.getElementById('stats').innerHTML=[
    ['Photos queued',queue],
    ['Posts published',postedCount],
    ['Avg reach', avgReach!=null?avgReach.toLocaleString():'—'],
    ['Total shares', totalShares||'—'],
  ].map(([l,n])=>`<div class="stat"><div class="n">${n}</div><div class="l">${l}</div></div>`).join('');

  // recent posts — EVERY type, newest first, with stats + a click-to-expand detail
  const renderedSet=new Set(Array.isArray(rendered)?rendered.filter(f=>/_1\.jpg$/i.test(f.name)).map(f=>f.name.replace(/_1\.jpg$/i,'')):[]);
  const storyRendered=new Set(Array.isArray(rendered)?rendered.filter(f=>/_story\.jpg$/i.test(f.name)).map(f=>f.name.replace(/_story\.jpg$/i,'')):[]);
  const capById={},urlById={},tsById={}; (Array.isArray(posts)?posts:[]).forEach(p=>{if(p.id){capById[p.id]=p.caption||'';urlById[p.id]=p.thumb||'';tsById[p.id]=p.ts||p.date||'';}});
  const recentPosts=ins.slice().filter(x=>x.date).sort((a,b)=>(''+(tsById[b.id]||b.date)).localeCompare(''+(tsById[a.id]||a.date))).slice(0,12);
  const badge={reel:'Reel',story:'Story',carousel:'Carousel',single:'Post',video:'Video'};
  const fnum=n=>typeof n==='number'?n.toLocaleString():null;
  const keyStats=x=>{const b=[];if(fnum(x.reach))b.push(`<b>${fnum(x.reach)}</b> reach`);if(fnum(x.views))b.push(`<b>${fnum(x.views)}</b> views`);if(x.shares)b.push(`<b>${x.shares}</b> shares`);return b.join(' · ')||(x.error?'no insights for this one':'—');};
  const allStats=x=>{const skip=new Set(['id','date','base','format','category','pillar','error','interactions','eng_rate']);
    const rows=Object.keys(x).filter(k=>!skip.has(k)&&typeof x[k]==='number').sort().map(k=>`<tr><td>${k.replace(/_/g,' ')}</td><td>${x[k].toLocaleString()}</td></tr>`).join('');
    const er=typeof x.eng_rate==='number'?`<tr><td>engagement rate</td><td>${(x.eng_rate*100).toFixed(1)}%</td></tr>`:'';
    return (rows||er)?`<table class="detail">${rows}${er}</table>`:'<div class="muted" style="font-size:12px">No insights captured for this one.</div>';};
  document.getElementById('recent').innerHTML = recentPosts.length? recentPosts.map(x=>{
    const base=x.base||''; const fmt=x.format||'single';
    const lbl=badge[fmt]||fmt;
    const storyBase=base.replace(/-story$/,'');
    let cover;
    if(fmt==='story' && storyRendered.has(storyBase))
      cover=`<img src="${RAW}/rendered/${encodeURIComponent(storyBase)}_story.jpg" loading="lazy" onerror="imgFail(this,'Story')">`;
    else if(renderedSet.has(base))
      cover=`<img src="${RAW}/rendered/${encodeURIComponent(base)}_1.jpg" loading="lazy" onerror="imgFail(this,'${lbl}')">`;
    else if(urlById[x.id])
      cover=`<img src="${urlById[x.id]}" loading="lazy" referrerpolicy="no-referrer" onerror="imgFail(this,'${lbl}')">`;
    else cover=`<div class="badge">${lbl}</div>`;
    const cap=capById[x.id]||'';
    return `<div class="card" onclick="this.classList.toggle('open')"><div class="tag">${badge[fmt]||fmt}</div>${cover}`
      +`<div class="meta"><div class="muted" style="font-size:11px">${x.date||''} · tap for detail</div><div>${keyStats(x)}</div>`
      +`<div class="det">${allStats(x)}${cap?`<div class="cap">${cap}</div>`:''}</div></div></div>`;
  }).join('') : '<div class="muted">No posts yet — they\'ll appear here after the next run.</div>';

  // performance by post type (every format with its own stats)
  const byType={};
  ins.forEach(x=>{ if(typeof x.reach==='number'){ const f=x.format||'single'; (byType[f]=byType[f]||[]).push(x); } });
  const tkeys=Object.keys(byType).sort((a,b)=>byType[b].length-byType[a].length);
  const bt=document.getElementById('bytype');
  if(tkeys.length){
    const avg=(a,k)=>a.length?Math.round(a.reduce((s,x)=>s+(x[k]||0),0)/a.length):0;
    const avgEng=a=>{const v=a.filter(x=>typeof x.eng_rate==='number');return v.length?(v.reduce((s,x)=>s+x.eng_rate,0)/v.length*100).toFixed(1)+'%':'—';};
    bt.innerHTML=`<table><tr><th>Type</th><th>Posts</th><th>Avg reach</th><th>Avg shares</th><th>Avg eng%</th></tr>`+
      tkeys.map(f=>`<tr><td><b>${f}</b></td><td>${byType[f].length}</td><td>${avg(byType[f],'reach').toLocaleString()}</td><td>${avg(byType[f],'shares')}</td><td>${avgEng(byType[f])}</td></tr>`).join('')+`</table>`;
  } else { bt.innerHTML='<div class="muted">No insights yet.</div>'; }

  // performance table — ranked by REACH (this account earns reach + shares, not saves)
  const ranked=ins.filter(x=>typeof x.reach==='number')
                  .sort((a,b)=>(b.reach||0)-(a.reach||0)).slice(0,8);
  const perf=document.getElementById('perf');
  if(ranked.length){
    perf.innerHTML=`<table><tr><th>Date</th><th>Post</th><th>Reach</th><th>Shares</th><th>Eng%</th><th>Comments</th><th>Saves</th></tr>`+
      ranked.map(x=>`<tr><td>${x.date||''}</td><td>${x.base||''}</td><td>${(x.reach||0).toLocaleString()}</td><td>${x.shares||0}</td><td>${typeof x.eng_rate==='number'?(x.eng_rate*100).toFixed(1)+'%':'—'}</td><td>${x.comments||0}</td><td>${x.saved||0}</td></tr>`).join('')+`</table>`;
  } else {
    perf.innerHTML='<div class="note">No performance numbers yet — the daily insights job fills these in. Ranked by reach + shares, the signals this account actually earns (saves are ~zero).</div>';
  }
  document.getElementById('updated').textContent='Updated '+new Date().toLocaleString();
}
load();
</script>
